<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>韵哥三关背单词 - 线框图 (Noto Emoji版)</title>
<!-- Google Fonts: Nunito + Noto Emoji + ZCOOL KuaiLe -->
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Color+Emoji&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<noscript><link href="https://fonts.loli.net/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Color+Emoji&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet"></noscript>
<!-- 1b-模块2：字体加载超时保护（希沃兼容，3秒兜底） -->
<script>
setTimeout(function() {
    var links = document.querySelectorAll('link[rel="preload"][as="style"]');
    for (var i = 0; i < links.length; i++) { links[i].rel = 'stylesheet'; }
}, 3000);
</script>
<style>
/* ========================================
   1a-④ CSS 三层变量体系
   ======================================== */

/* Layer 1: 基础色值 (Base Tokens) */
:root {
  /* 色板 */
  --color-blue-100: #E3F2FD;
  --color-blue-400: #29B6F6;
  --color-blue-500: #3498db;
  --color-blue-600: #1E88E5;
  --color-blue-700: #1565C0;
  --color-green-100: #e8f5e9;
  --color-green-400: #66BB6A;
  --color-green-500: #4caf50;
  --color-green-700: #2e7d32;
  --color-red-400: #E53935;
  --color-orange-300: #FFB74D;
  --color-orange-400: #ff9800;
  --color-orange-500: #FF8F00;
  --color-orange-600: #FB8C00;
  --color-yellow-400: #ffc107;
  --color-yellow-700: #856404;
  --color-yellow-alpha: rgba(255,179,0,0.3);
  --color-purple-400: #AB47BC;
  --color-purple-600: #8E24AA;
  --color-pink-500: #E91E63;
  --color-brown-900: #3e2723;
  --color-gray-100: #f8f9fa;
  --color-gray-200: #e9ecef;
  --color-gray-300: #dee2e6;
  --color-gray-400: #ced4da;
  --color-gray-500: #adb5bd;
  --color-gray-600: #868e96;
  --color-gray-700: #6c757d;
  --color-gray-800: #495057;
  --color-gray-900: #343a40;
  --color-dark-900: #2c3e50;
  --color-dark-950: #1a2332;
  --color-white: #ffffff;
  --color-white-88: rgba(255,255,255,0.88);
  --color-white-90: rgba(255,255,255,0.9);
  --color-white-70: rgba(255,255,255,0.7);
  --color-white-50: rgba(255,255,255,0.5);
  --color-white-30: rgba(255,255,255,0.3);
  --color-white-15: rgba(255,255,255,0.15);
  --color-white-10: rgba(255,255,255,0.1);
  --color-black-15: rgba(0,0,0,0.15);
  --color-black-25: rgba(0,0,0,0.25);
  --color-tip-bg: rgba(255,243,205,0.95);
  
  /* 间距 */
  --space-xxs: 2px;
  --space-xs: 4px;
  --space-sm: 6px;
  --space-md: 8px;
  --space-lg: 10px;
  --space-xl: 12px;
  --space-2xl: 14px;
  --space-3xl: 16px;
  --space-4xl: 20px;
  --space-5xl: 24px;
  --space-6xl: 30px;
  
  /* 圆角 */
  --radius-xs: 3px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 10px;
  --radius-2xl: 12px;
  --radius-3xl: 16px;
  --radius-4xl: 20px;
  --radius-5xl: 24px;
  --radius-full: 50%;
  
  /* 阴影 */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.1);
  --shadow-md: 0 4px 20px var(--color-black-15);
  --shadow-lg: 0 8px 32px var(--color-black-25);
}

/* Layer 2: 语义用途 (Semantic Tokens) */
:root {
  /* 颜色语义 */
  --color-primary: var(--color-blue-400);
  --color-primary-active: var(--color-blue-500);
  --color-success: var(--color-green-500);
  --color-success-dark: var(--color-green-700);
  --color-success-bg: var(--color-green-100);
  --color-warning: var(--color-yellow-400);
  --color-warning-text: var(--color-yellow-700);
  --color-warning-bg: var(--color-tip-bg);
  --color-error: var(--color-red-400);
  --color-info: var(--color-orange-400);
  
  /* 关卡标识色 */
  --color-l1-accent: var(--color-green-400);
  --color-l2-accent: var(--color-orange-500);
  --color-l3-accent: var(--color-purple-400);
  
  /* 音节色 */
  --syl-color-1: var(--color-blue-600);
  --syl-color-2: var(--color-red-400);
  --syl-color-3: var(--color-green-500);
  --syl-color-4: var(--color-orange-600);
  --syl-color-5: var(--color-purple-600);
  --syl-color-6: var(--color-pink-500);
  
  /* 背景语义 */
  --bg-body: radial-gradient(circle, var(--color-white) 30%, var(--color-dark-950) 100%);
  --bg-surface: var(--color-white);
  --bg-surface-muted: var(--color-gray-100);
  --bg-control-bar: var(--color-dark-900);
  --bg-topbar: var(--color-blue-400);
  --bg-bottombar: var(--color-gray-100);
  --bg-sidepanel: var(--color-brown-900);
  
  /* 文字语义 */
  --text-primary: var(--color-gray-800);
  --text-secondary: var(--color-gray-700);
  --text-tertiary: var(--color-gray-600);
  --text-placeholder: var(--color-gray-500);
  --text-on-dark: var(--color-white);
  --text-on-dark-muted: var(--color-white-70);
  --text-on-dark-strong: var(--color-white-90);
  --text-label: var(--color-gray-900);
  
  /* 边框语义 */
  --border-light: var(--color-gray-300);
  --border-default: var(--color-gray-400);
  --border-dashed: var(--color-gray-500);
  --border-on-dark: var(--color-white-30);
  --border-on-dark-dashed: var(--color-white-50);
  
  /* 间距语义 */
  --spacing-xs: var(--space-xs);
  --spacing-sm: var(--space-md);
  --spacing-md: var(--space-xl);
  --spacing-lg: var(--space-4xl);
  --spacing-xl: var(--space-6xl);
  --spacing-card: var(--space-xl);
  --spacing-button-gap: var(--space-lg);
  
  /* 圆角语义 */
  --radius-button: var(--radius-5xl);
  --radius-card: var(--radius-2xl);
  --radius-input: var(--radius-sm);
  --radius-badge: var(--radius-sm);
}

/* Layer 3: 组件变量 (Component Tokens) */
:root {
  /* 顶部栏 */
  --topbar-bg: var(--bg-topbar);
  --topbar-text: var(--text-on-dark);
  --topbar-title-font-size: 13px;
  --topbar-title-weight: 600;
  --topbar-padding: var(--space-lg) var(--space-xl);
  --topbar-min-height: 44px;
  
  /* 控制栏 */
  --controlbar-bg: var(--bg-control-bar);
  --controlbar-text: var(--text-on-dark);
  --controlbar-title-size: 16px;
  --controlbar-btn-size: 13px;
  --controlbar-btn-radius: var(--radius-md);
  --controlbar-btn-border: var(--border-on-dark);
  --controlbar-btn-active-bg: var(--color-primary-active);
  --controlbar-btn-active-border: var(--color-primary-active);
  
  /* 进度条 */
  --progress-bar-height: 6px;
  --progress-bar-bg: var(--color-gray-200);
  --progress-bar-fill: var(--color-gray-500);
  --progress-bar-radius: var(--radius-xs);
  --progress-text-color: var(--text-secondary);
  --progress-text-size: 11px;
  
  /* 计时器 */
  --timer-border: var(--color-warning);
  --timer-text: var(--color-info);
  --timer-size: 34px;
  --timer-font-size: 11px;
  
  /* 图片格子 */
  --img-box-border: var(--border-default);
  --img-box-bg: var(--bg-surface-muted);
  --img-box-radius: var(--radius-lg);
  --img-emoji-size: 60px;
  --img-label-bg: var(--color-white-88);
  --img-label-text: var(--text-label);
  --img-label-radius: var(--radius-sm);
  --img-label-size: 13px;
  
  /* 大图展示 */
  --big-img-border: var(--border-default);
  --big-img-bg: var(--bg-surface-muted);
  --big-img-radius: var(--radius-card);
  --big-emoji-size: 120px;
  --hint-emoji-size: 120px;
  
  /* 选词格子 */
  --word-choice-border: var(--color-orange-300);
  --word-choice-bg: var(--bg-surface-muted);
  --word-choice-text: var(--text-primary);
  --word-choice-radius: var(--radius-xl);
  --word-choice-font-size: 18px;
  --word-choice-selected-border: var(--color-success);
  --word-choice-selected-bg: var(--color-success-bg);
  --word-choice-selected-text: var(--color-success-dark);
  
  /* 中文浮层 */
  --overlay-bg: var(--color-white-88);
  --overlay-text: var(--text-primary);
  --overlay-radius: var(--radius-sm);
  --overlay-font-size: 14px;
  
  /* 单词展示区 */
  --word-display-text: var(--color-gray-900);
  --word-display-size: 26px;
  --syllable-text: var(--color-gray-600);
  --syllable-size: 18px;
  
  /* 麦克风按钮 */
  --mic-border: var(--color-gray-500);
  --mic-size: 56px;
  --mic-emoji-size: 22px;
  --mic-tip-text: var(--color-gray-500);
  --mic-tip-size: 10px;
  
  /* 播放按钮 */
  --play-btn-border: var(--color-gray-700);
  --play-btn-text: var(--text-primary);
  --play-btn-radius: var(--radius-4xl);
  --play-btn-font-size: 11px;
  
  /* 底部栏按钮 */
  --bottom-bar-bg: var(--bg-bottombar);
  --bottom-bar-border: var(--border-light);
  --primary-btn-bg: var(--color-gray-200);
  --primary-btn-border: var(--color-gray-500);
  --primary-btn-text: var(--text-primary);
  --secondary-btn-border: var(--color-gray-400);
  --secondary-btn-text: var(--color-gray-600);
  
  /* L3拼写区 */
  --spelling-slot-border: var(--color-gray-500);
  --spelling-slot-bg: var(--bg-surface);
  --spelling-slot-text: var(--text-primary);
  --spelling-slot-radius: var(--radius-sm);
  --spelling-slot-width: 32px;
  --spelling-slot-height: 40px;
  --letter-tile-border: var(--color-gray-400);
  --letter-tile-bg: var(--bg-surface-muted);
  --letter-tile-text: var(--text-primary);
  --letter-tile-radius: var(--radius-md);
  
  /* 提示条 */
  --tipbar-bg: var(--color-warning-bg);
  --tipbar-border: var(--color-warning);
  --tipbar-text: var(--color-warning-text);
  --tipbar-font-size: 10px;
  
  /* 侧边栏 */
  --sidepanel-bg: var(--bg-sidepanel);
  --sidepanel-text: var(--text-on-dark-muted);
  --sidepanel-heading: var(--text-on-dark-strong);
  --sidepanel-padding: var(--space-6xl) var(--space-4xl);
  
  /* 结果页 */
  --result-stars-size: 32px;
  --result-score-size: 24px;
  --result-score-text: var(--text-primary);
  --result-detail-text: var(--color-gray-600);
  --result-detail-size: 13px;
  
  /* 标题星星 */
  --title-star-size: 22px;
  --title-star-shadow: drop-shadow(0 1px 2px var(--color-yellow-alpha));
}

/* Dark 主题预留（Layer 1 覆盖） */
[data-theme="dark"] {
  /* TODO: 1b阶段实现完整暗色主题 */
  --bg-surface: #1e1e1e;
  --bg-surface-muted: #2d2d2d;
  --text-primary: #e0e0e0;
  --text-secondary: #b0b0b0;
  --text-tertiary: #909090;
  --border-light: #444;
  --border-default: #555;
}

/* Noto Emoji 样式 */
.emoji, .img-emoji, .big-emoji, .hint-emoji, .mic-btn, .mode-btn, .play-btn, .tip-bar {
  font-family: "Nunito", 'Noto Color Emoji', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  display: inline-block;
  vertical-align: middle;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  overflow: hidden;
  touch-action: none;
  -webkit-overflow-scrolling: auto;
}

body {
  font-family: "Nunito", 'Noto Color Emoji', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-body);
  font-weight: 500;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* 设备适配：游戏容器 */
#deviceFrame {
  transform-origin: center center;
  box-shadow: var(--shadow-lg);
}

/* 顶部控制栏 */
.control-bar {
  position: relative;
  background: var(--controlbar-bg);
  color: var(--controlbar-text);
  padding: var(--space-xl) var(--space-4xl);
  display: none;
  align-items: center;
  gap: var(--space-4xl);
  z-index: 100;
  flex-wrap: nowrap;
  flex-shrink: 0;
  overflow-x: auto;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.control-bar.hover-visible {
  display: flex !important;
}
.control-bar h1 {
  font-size: var(--controlbar-title-size);
  font-weight: 600;
  margin-right: var(--space-lg);
}
.control-group {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}
.control-group label {
  font-size: var(--controlbar-btn-size);
  opacity: 0.8;
}
.control-group button {
  padding: 6px 14px;
  border: 1px solid var(--controlbar-btn-border);
  background: transparent;
  color: var(--controlbar-text);
  border-radius: var(--controlbar-btn-radius);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.control-group button:hover {
  background: var(--color-white-10);
}
.control-group button.active {
  background: var(--controlbar-btn-active-bg);
  border-color: var(--controlbar-btn-active-border);
}

/* 展示区域 */
.preview-area {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 0;
  flex: 1;
}

/* 设备框架 */
.device-frame {
  position: relative;
  background: var(--bg-surface);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}
.device-label {
  position: absolute;
  top: -28px;
  left: 0;
  font-size: 13px;
  color: #666;
  font-weight: 500;
}

/* 通用界面元素样式（线框风） */
.wireframe {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* 顶部栏 */
.top-bar {
  background: var(--topbar-bg);
  border-bottom: none;
  padding: var(--topbar-padding);
  min-height: var(--topbar-min-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--topbar-text);
  position: relative;
  box-sizing: border-box;
}
.top-bar .back {
  width: 24px;
  height: 24px;
  border: 1px dashed var(--color-white-50);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--topbar-text);
}
.top-bar .title {
  font-weight: var(--topbar-title-weight);
  font-size: var(--topbar-title-font-size);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  color: var(--topbar-text);
}
.top-bar .mode-btn {
  padding: 4px 8px;
  border: 1px dashed var(--color-white-50);
  border-radius: var(--radius-sm);
  font-size: 10px;
  color: var(--topbar-text);
}

/* 进度条区 */
.progress-section {
  padding: var(--space-lg) var(--space-2xl);
  font-size: var(--progress-text-size);
  color: var(--progress-text-color);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3xl);
}
.progress-text { flex: 0 0 auto; width: 70%; max-width: 260px; text-align: center; margin-left: 70px; }
.progress-bar {
  height: var(--progress-bar-height);
  background: var(--progress-bar-bg);
  border-radius: var(--progress-bar-radius);
  margin-top: var(--space-xs);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--progress-bar-fill);
  border-radius: var(--progress-bar-radius);
}
.timer-circle {
  width: var(--timer-size);
  height: var(--timer-size);
  border: 2px dashed var(--timer-border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--timer-font-size);
  font-weight: 700;
  margin-top: var(--space-sm);
  color: var(--timer-text);
  flex-shrink: 0;
}

/* 内容区 */
.content-area {
  padding: var(--space-md) var(--space-xl);
}

/* L1: 图片2x2网格 */
.img-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-lg);
  margin: var(--space-md) 0;
}
.img-box {
  aspect-ratio: 1;
  min-height: 100px;
  border: 2px dashed var(--img-box-border);
  border-radius: var(--img-box-radius);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: var(--img-box-bg);
  position: relative;
  overflow: hidden;
}
.img-box .img-emoji {
  position: absolute;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: var(--img-emoji-size);
}
.img-box .img-label {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  padding: var(--space-xxs) var(--space-lg);
  background: var(--img-label-bg);
  border-radius: var(--img-label-radius);
  font-size: var(--img-label-size);
  font-weight: 600;
  color: var(--img-label-text);
  text-align: center;
  white-space: nowrap;
}

/* L2: 大图+麦克风 */
.big-img-box {
  border: 2px dashed var(--big-img-border);
  border-radius: var(--big-img-radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--big-img-bg);
  margin: 4px auto;
  width: 85%;
  max-width: 260px;
  aspect-ratio: 1 / 1;
  position: relative;
  overflow: hidden;
}
.big-img-box .big-emoji {
  position: absolute;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: var(--big-emoji-size);
}
.big-img-box .label { font-size: 12px; color: var(--text-tertiary); margin-top: var(--space-lg); }

/* L3底部提示图 - 比L2小一点 */
.l3-hint-img {
  position: relative;
  overflow: hidden;
  border: 2px dashed var(--big-img-border);
  border-radius: var(--radius-xl);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--big-img-bg);
  margin: 0 auto;
  width: 78%;
  max-width: 260px;
  aspect-ratio: 1 / 1;
}
.l3-hint-img .hint-emoji {
  position: absolute;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: var(--hint-emoji-size);
}

/* L2选词模式：小图+2x2单词选项 */
.word-choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-lg);
  padding: 0 var(--space-xl);
}
.word-choice-item {
  border: 2px solid var(--word-choice-border);
  border-radius: var(--word-choice-radius);
  padding: 14px 8px;
  text-align: center;
  font-size: var(--word-choice-font-size);
  font-weight: 700;
  color: var(--word-choice-text);
  background: var(--word-choice-bg);
  letter-spacing: 2px;
}
.word-choice-item.selected {
  border-color: var(--word-choice-selected-border);
  background: var(--word-choice-selected-bg);
  color: var(--word-choice-selected-text);
}

/* 中文释义浮层（图片底部overlay） */
.chinese-overlay {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
}
.big-img-box .chinese-overlay { bottom: 22px; }
.l3-hint-img .chinese-overlay { bottom: 16px; }
.chinese-overlay span {
  display: inline-block;
  padding: var(--space-xxs) var(--space-xl);
  background: var(--overlay-bg);
  border-radius: var(--overlay-radius);
  font-size: var(--overlay-font-size);
  font-weight: 600;
  color: var(--overlay-text);
}

/* 音节颜色区分：蓝红绿橙紫玫红 */
.syl-1 { color: var(--syl-color-1); }  /* 蓝 */
.syl-2 { color: var(--syl-color-2); }  /* 红 */
.syl-3 { color: var(--syl-color-3); }  /* 绿 */

<script>
const devices = {
  'phone': { label: '手机竖屏 375×667 (iPhone SE基准)', width: 375, height: 667, type: 'mobile' },
  'ipad-portrait': { label: 'iPad竖屏 768×1024 (10.2寸)', width: 700, height: 936, type: 'tablet-v' },
  'ipad-landscape': { label: 'iPad横屏 1024×768 (10.2寸)', width: 900, height: 675, type: 'tablet-h' },
  'laptop': { label: '笔记本 1440×900 (13~16寸)', width: 1000, height: 625, type: 'laptop' },
  'bigscreen': { label: '大屏投影 1920×1080 (教室级)', width: 1100, height: 619, type: 'bigscreen' }
};

let currentDevice = 'phone';
let currentLevel = 'l1';
const gameState = { currentLevel: 'l1', lastLevel: 'l1' };
let totalCoins = 0;  // 累计金币数

// ========== 路由系统 (1a-①) ==========
let currentParams = {};      // 当前路由参数 {unit, level}
let selectedUnit = null;     // 首页已选单元（子状态，不产生路由）
let isInGame = false;        // 是否在游戏页中（用于后退拦截）
let isNavigating = false;    // 是否程序发起的导航（区分浏览器后退）
let previousHash = '#/';     // 上一次hash（后退拦截时用于恢复）

// 路由映射表
const Router = {
  routeMap: {
    '': 'home', '/': 'home',
    '/l1': 'l1', '/l2': 'l2', '/l3': 'l3',
    '/result': 'level-result', '/final': 'final-result',
    '/leaderboard': 'leaderboard'
  },

  // 解析hash → { route, params }
  parse(hash) {
    const clean = (hash || '').replace(/^#/, '');
    const [path, qs] = clean.split('?');
    const route = this.routeMap[path] || 'home';
    const params = {};
    if (qs) {
      qs.split('&').forEach(function(p) {
        const [k, v] = p.split('=');
        if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
      });
    }
    return { route: route, params: params };
  },

  // 导航到指定路由（改变hash）
  go(path, params) {
    params = params || {};
    let hash = '#' + path;
    const parts = [];
    for (const k in params) {
      if (params[k] != null) {
        parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
      }
    }
    if (parts.length) hash += '?' + parts.join('&');
    location.hash = hash;
  }
};

// 便捷导航函数（标记为程序导航，避免触发后退拦截）
function navigate(path, params) {
  isNavigating = true;
  Router.go(path, params);
}

// 重置当前关卡（不走路由，内部处理 - 坑4防范）
function resetLevel() {
  console.log('[路由] resetLevel() - 内部重置，不改变hash');
  resetLevelState();  // 调用1a-②状态管理系统
  render();
}

// 从hash同步状态
function syncFromHash() {
  const parsed = Router.parse(location.hash);
  const route = parsed.route;
  const params = parsed.params;

  // 坑2防范：游戏页需要unit参数，缺失则重定向home
  if (['l1', 'l2', 'l3', 'level-result'].indexOf(route) >= 0 && !params.unit) {

  isInGame = ['l1', 'l2', 'l3'].indexOf(route) >= 0;

// ==================== 1. 存储系统封装（🟢复用消消乐StorageMgr，key前缀改为wordGame_）====================
const StorageMgr = {
    VERSION_KEY: 'storageVersion',
    CURRENT_VERSION: 1,

    // 安全JSON解析（复用消消乐 safeJSONParse）
    safeJSONParse(str, fallback) {
        try {
            return JSON.parse(str);
        } catch(e) {
            console.error('[StorageMgr] 解析失败，使用默认值:', e);
            return fallback;
        }
    },

    // 读取存储
    get(key, fallback) {
        const fullKey = `wordGame_${key}`;
        const raw = localStorage.getItem(fullKey);
        if (raw === null) return fallback;
        return this.safeJSONParse(raw, fallback);
    },

    // 写入存储（含失败捕获：隐私模式/存储满）
    set(key, value) {
        const fullKey = `wordGame_${key}`;
        try {
            localStorage.setItem(fullKey, JSON.stringify(value));
            return true;
        } catch(e) {
            console.error('[StorageMgr] 写入失败:', key, e);
            return false;
        }
    },

    // 删除存储
    remove(key) {
        const fullKey = `wordGame_${key}`;
        localStorage.removeItem(fullKey);
    },

    // 版本迁移（开发方案§13.4.5）
    migrate() {
        const storedVersion = this.get(this.VERSION_KEY, 0);
        if (storedVersion >= this.CURRENT_VERSION) return false;
        console.log(`[StorageMgr] 迁移存储数据 v${storedVersion} → v${this.CURRENT_VERSION}`);
        this.set(this.VERSION_KEY, this.CURRENT_VERSION);
        return true;
    },

    // 初始化
    init() {
        this.migrate();
    }
};

// ==================== 2. 业务层存储方法 ====================
const GameState = {
    // ---- 单元进度（各单元星级、最佳成绩）----
    getUnitProgress() {
        return StorageMgr.get('unitProgress', {});
    },

    // 保存单元进度（取最高分，开发方案§8.1.4）
    saveUnitProgress(unitId, data) {
        const progress = this.getUnitProgress();
        const existing = progress[unitId];
        if (existing && existing.bestScore >= data.bestScore) {
            existing.completedAt = data.completedAt;
        } else {
            progress[unitId] = data;
        }
        StorageMgr.set('unitProgress', progress);
    },

    // ---- 错题本（开发方案§7.2）----
    getErrorBook() {
        return StorageMgr.get('errorBook', {});
    },

    // 保存错题（同词去重，记录答错次数和关卡）
    saveErrorBook(unitId, wrongWords) {
        const book = this.getErrorBook();
        if (!book[unitId]) book[unitId] = [];

        wrongWords.forEach(function(w) {
            const existing = book[unitId].find(function(e) { return e.word === w.word; });
            if (existing) {
                existing.wrongCount = (existing.wrongCount || 0) + 1;
                existing.lastWrongTime = new Date().toISOString();
                if (!existing.wrongLevels) existing.wrongLevels = [];
                if (w.level && existing.wrongLevels.indexOf(w.level) < 0) {
                    existing.wrongLevels.push(w.level);
                }
            } else {
                book[unitId].push({
                    word: w.word,
                    chinese: w.chinese,
                    wrongCount: 1,
                    lastWrongTime: new Date().toISOString(),
                    wrongLevels: w.level ? [w.level] : []
                });
            }
        });

        StorageMgr.set('errorBook', book);
    },

    // ---- 引导标记（虚拟手指、隐私提示等）----

};

// ==================== 5. 数据加载函数（②文档§2）====================

/**
 * 按册加载词库JSON（②文档§2.1）
 * 用户选定册后一次加载整册数据到内存，切换单元时无需重新加载
 * @param {string} gradeId - 册标识，如 'pep-grade3-start'
 */
function loadWordBank(gradeId) {
    if (gradeId === 'pep-grade3-start') {
        wordBankData = WORD_BANK_GRADE3_START;
        currentGrade = gradeId;
        buildPoolLookupMap();
        console.log('[词库] 已加载:', wordBankData.name, '共', wordBankData.units.length, '个单元');
    } else {
        console.warn('[词库] 未找到册:', gradeId);
        wordBankData = null;
    }
}

/**
 * 构建大池子查找表：将所有单元的词汇以 word小写 为key建立Map
 * 用于自定义词库输入时自动匹配emoji/音标/音节等完整数据
 * 调用时机：loadWordBank() 加载词库后执行，切册/加单元时需重建
 */
function buildPoolLookupMap() {
    poolLookupMap = {};
    if (!wordBankData || !wordBankData.units) return;
    wordBankData.units.forEach(function(unit) {
        if (!unit.words) return;
        unit.words.forEach(function(w) {
            var key = (w.word || w.enRaw || '').toLowerCase();
            if (key && !poolLookupMap[key]) {
                poolLookupMap[key] = w;
            }
        });
    });
    console.log('[词库] 池子查找表已构建，共', Object.keys(poolLookupMap).length, '个词');
}

/**
 * 从已加载的册数据中提取指定单元的词汇（②文档§2.1）
 * @param {string} unitId - 单元ID，如 'pep-grade3-u1'
 * @returns {array} 词汇列表
 */
function loadUnitWords(unitId) {
    var rawWords = [];

    // 自定义词库：从localStorage读取
    if (unitId && unitId.indexOf('custom-') === 0) {
        var vocabName = unitId.substring(7); // 去掉 'custom-' 前缀
        var saved = StorageMgr.get('customVocabs', []);
        var found = null;
        for (var i = 0; i < saved.length; i++) {
            if (saved[i].name === vocabName) { found = saved[i]; break; }
        }
        if (!found || !found.vocabList || found.vocabList.length === 0) {
            console.error('[词库] 自定义词库未找到或为空:', vocabName);
            return [];
        }
        rawWords = found.vocabList;
        console.log('[词库] 已加载自定义词库:', vocabName, '共', rawWords.length, '词');
    } else {
        // 内置词库：从wordBankData读取
        if (!wordBankData) {
            console.error('[词库] 词库未加载，请先调用 loadWordBank()');
            return [];
        }

        const unit = wordBankData.units.find(function(u) { return u.id === unitId; });
        if (!unit) {
            console.error('[词库] 未找到单元:', unitId);
            return [];
        }
        rawWords = unit.words;
        console.log('[词库] 已加载单元:', unit.name, '共', rawWords.length, '词');
    }

    // 字段兼容：确保每个词都有 en/cn 字段（游戏引擎依赖）
    currentUnitWords = rawWords.map(function(w) {
        // 如果已有 en 字段，直接返回
        if (w.en) return w;
        // 否则做字段映射：word/enRaw → en, chinese/cn → cn
        return Object.assign({}, w, {
            en: w.word || w.enRaw || w.en || '',
            cn: w.chinese || w.cn || ''
        });
    });

    return currentUnitWords;
}

// ==================== 6. 状态更新函数（②文档§3）====================

/**
 * 计算星级（开发方案§8.1.3，与消消乐五星体系一致）
 * @param {number} scoreRate - 得分率（0-100）
 * @returns {number} 星级（0-5）
 */
function calculateStars(scoreRate) {
    if (scoreRate >= 95) return 5;
    if (scoreRate >= 80) return 4;
    if (scoreRate >= 60) return 3;
    if (scoreRate >= 40) return 2;
    if (scoreRate >= 20) return 1;
    return 0;
}

/**
 * 生成关卡题目顺序（随机打乱单元词库，开发方案§3.1.5）
 * @param {number} questionCount - 题目数量（默认5题，由单元词量决定）
 * @returns {array} 题目顺序数组（词库索引）
 */
function generateQuestionOrder(questionCount) {
    if (!currentUnitWords || currentUnitWords.length === 0) {
        console.error('[状态] 词库为空，无法生成题目');
        return [];
    }

    var count = questionCount || Math.min(5, currentUnitWords.length);
    var indices = [];
    for (var i = 0; i < currentUnitWords.length; i++) indices.push(i);

    // Fisher-Yates 洗牌
    for (var i = indices.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = indices[i];
        indices[i] = indices[j];
        indices[j] = temp;
    }

    questionOrder = indices.slice(0, count);
    questionBestScores = new Array(count).fill(0);
    return questionOrder;
}

/**
 * 记录题目得分（取最高分机制，开发方案§8.1.4）
 * @param {number} questionIdx - 题目序号（0开始）
 * @param {number} score - 本次得分（0-100）
 */
function recordQuestionScore(questionIdx, score) {
    if (questionIdx < 0 || questionIdx >= questionBestScores.length) return;
    if (score > questionBestScores[questionIdx]) {
        questionBestScores[questionIdx] = score;
    }
    recalcLevelScore();
}

/**
 * 重新计算当前关卡得分（百分制 = 各题最高分的平均值）
 */
function recalcLevelScore() {
    if (questionBestScores.length === 0) {
        currentLevelScore = 0;
        return;
    }
    var sum = 0;
    for (var i = 0; i < questionBestScores.length; i++) sum += questionBestScores[i];
    currentLevelScore = Math.round(sum / questionBestScores.length);
}

/**
 * 关卡结束处理（②文档§3.2）
 * @param {string} level - 关卡标识 l1/l2/l3
 */
function finalizeLevel(level) {
    recalcLevelScore();
    levelScores[level] = currentLevelScore;
    levelStars[level] = calculateStars(currentLevelScore);

    if (levelStartTime) {
        levelTimeSpent[level] = Math.round((Date.now() - levelStartTime) / 1000);
    }

    // 错词标记关卡来源后合并到总列表
    if (wrongWordsInLevel.length > 0) {
        wrongWordsInLevel.forEach(function(w) { w.level = level; });
        allWrongWords = allWrongWords.concat(wrongWordsInLevel);
    }

    // Step3a: 保存本关答对/总题数
    var correctInLevel = questionBestScores.filter(function(s) { return s > 0; }).length;
    levelDetails[level] = { correct: correctInLevel, total: questionOrder.length };

    console.log('[状态] 关卡结束:', level,
        '得分:', currentLevelScore,
        '星级:', levelStars[level],
        '用时:', levelTimeSpent[level], '秒',
        '错词:', wrongWordsInLevel.length,
        '答对:', correctInLevel, '/', questionOrder.length);

    // b1: 保存成绩到排行榜（开发方案§7.6.1）
    saveScore(level, currentLevelScore, levelTimeSpent[level] || 0);

    // BUG4修复: 保存进度（含已完成关卡成绩），防止resumeGame丢失
    StorageMgr.set('savedGame', {
        unitId: currentUnit,
        currentLevel: level,
        levelScores: { l1: levelScores.l1, l2: levelScores.l2, l3: levelScores.l3 },
        levelStars: { l1: levelStars.l1, l2: levelStars.l2, l3: levelStars.l3 },
        levelTimeSpent: { l1: levelTimeSpent.l1, l2: levelTimeSpent.l2, l3: levelTimeSpent.l3 },
        savedAt: new Date().toISOString()
    });
}

/**
 * 计算三关加权总分（开发方案§8.1.1：L1×30% + L2×30% + L3×40%）
 * @returns {number} 加权总分（0-100）
 */
function calculateTotalScore() {
    return Math.round(
        levelScores.l1 * 0.3 +
        levelScores.l2 * 0.3 +
        levelScores.l3 * 0.4
    );
}

/**
 * 计算总星级
 * @returns {number} 总星级（0-15）
 */
function calculateTotalStars() {
    return levelStars.l1 + levelStars.l2 + levelStars.l3;
}

/**
 * 添加错词到当前关卡错词列表（同词同关去重）
 * @param {string} word - 单词
 * @param {string} chinese - 中文释义
 */
function addWrongWord(word, chinese) {
    var exists = wrongWordsInLevel.find(function(w) { return w.word === word; });
    if (!exists) {
        wrongWordsInLevel.push({ word: word, chinese: chinese });
    }
}

/**
 * 三关全部完成，持久化数据（②文档§3.3）
 * @param {string} unitId - 单元ID
 */
function finalizeGame(unitId) {
    var totalScore = calculateTotalScore();
    var totalStars = calculateTotalStars();

    // 持久化单元进度（取最高分）
    GameState.saveUnitProgress(unitId, {
        stars: totalStars,
        bestScore: totalScore,
        completedAt: new Date().toISOString().slice(0, 10)
    });

    // 持久化错题本
    if (allWrongWords.length > 0) {
        GameState.saveErrorBook(unitId, allWrongWords);
    }

    console.log('[状态] 游戏完成:', unitId,
        '总分:', totalScore,
        '总星级:', totalStars,
        '错词总数:', allWrongWords.length);
}


// ==================== b1-1. 错题本CSV导出（开发方案§7.2.5）====================
function downloadWrongCSV() {
    if (allWrongWords.length === 0) {
        showToast('暂无错题记录，太棒了！');
        return;
    }

    // CSV格式：单词,中文,答错关卡
    var headers = '单词,中文,答错关卡';
    var rows = allWrongWords.map(function(w) {
        var word = (w.word || '').replace(/"/g, '""');
        var chinese = (w.chinese || '').replace(/"/g, '""');
        var level = w.level || '';
        return '"' + word + '","' + chinese + '","' + level + '"';
    }).join('\n');

    var csvContent = '\ufeff' + headers + '\n' + rows; // BOM防Excel乱码
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    var unitName = currentUnit || 'Unit1';
    a.download = '三关背单词-错题本-' + unitName + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast('\u2705 错题本已导出到本地下载目录');
    console.log('[b1] 错题本CSV导出完成，共', allWrongWords.length, '条记录');
}

/**
 * \u4fdd\u5b58\u5355\u6b21\u6210\u7ee9\uff08\u5f00\u53d1\u65b9\u6848\u00a77.6.1\uff1a\u6bcf\u6b21\u6210\u7ee9\u90fd\u8bb0\u5f55\uff0c\u4fdd\u7559\u6700\u8fd110\u6b21\uff09
 */
function saveScore(level, score, timeUsed) {
    var scores = StorageMgr.get('leaderboard', []);
    var unitId = currentUnit || 'unknown';
    var record = {
        level: level,
        score: score,
        time: timeUsed,
        unitId: unitId,
        date: new Date().toLocaleDateString(),
        timestamp: Date.now()
    };
    scores.push(record);

    // \u540c\u4e00\u5355\u5143\uff0c\u53ea\u4fdd\u7559\u6700\u8fd110\u6b21\uff08\u6309\u65f6\u95f4\u6233\u5012\u5e8f\uff09
    var samePlayer = scores.filter(function(s) { return s.unitId === unitId; });
    if (samePlayer.length > 10) {
        samePlayer.sort(function(a, b) { return b.timestamp - a.timestamp; });
        var toRemove = new Set(samePlayer.slice(10));
        scores = scores.filter(function(s) { return !toRemove.has(s); });
    }
    StorageMgr.set('leaderboard', scores);
    console.log('[b1] \u6210\u7ee9\u5df2\u4fdd\u5b58:', level, score, 'time:', timeUsed);
}

/**
 * \u83b7\u53d6\u6392\u884c\u699c\uff08\u6309\u5355\u5143\u5206\u7ec4\uff0c\u6bcf\u5173\u53d6\u6700\u9ad8\u5206\uff0c\u7b97\u52a0\u6743\u603b\u5206\uff09
 * \u5f00\u53d1\u65b9\u6848\u00a78.1.3\uff1a\u4e09\u5173\u6743\u91cd L1=30% L2=30% L3=40%
 */
function getLeaderboard(unitId) {
    var scores = StorageMgr.get('leaderboard', []);
    var filtered = scores.filter(function(s) { return s.unitId === unitId; });

    // \u6309\u65f6\u95f4\u6233\u5206\u7ec4\uff08\u6bcf\u6b21\u5b8c\u6574\u95ef\u5173\u4e3a\u4e00\u7ec4\uff09
    var byTimestamp = {};
    filtered.forEach(function(s) {
        var key = s.timestamp;
        if (!byTimestamp[key]) {
            byTimestamp[key] = { levels: {}, date: s.date, timestamp: s.timestamp };
        }
        var lv = s.level;
        if (!byTimestamp[key].levels[lv] || s.score > byTimestamp[key].levels[lv].score) {
            byTimestamp[key].levels[lv] = { score: s.score, time: s.time };
        }
    });

    var WEIGHTS = { l1: 0.3, l2: 0.3, l3: 0.4 };
    var results = Object.keys(byTimestamp).map(function(key) {
        var data = byTimestamp[key];
        var l1 = data.levels.l1 ? data.levels.l1.score : 0;
        var l2 = data.levels.l2 ? data.levels.l2.score : 0;
        var l3 = data.levels.l3 ? data.levels.l3.score : 0;
        var totalScore = Math.round(l1 * WEIGHTS.l1 + l2 * WEIGHTS.l2 + l3 * WEIGHTS.l3);
        var totalTime = 0;
        if (data.levels.l1) totalTime += (data.levels.l1.time || 0);
        if (data.levels.l2) totalTime += (data.levels.l2.time || 0);
        if (data.levels.l3) totalTime += (data.levels.l3.time || 0);

        return {
            totalScore: totalScore,
            l1Score: l1,
            l2Score: l2,
            l3Score: l3,
            totalTime: totalTime,
            date: data.date
        };
    });

    results.sort(function(a, b) { return b.totalScore - a.totalScore; });
    return results.slice(0, 10);
}

// ========== ③-4 事件总线 EventBus ==========
const EventBus = {
    _listeners: {},
    
    on(event, callback, context = null) {
        if (!this._listeners[event]) this._listeners[event] = [];
        this._listeners[event].push({ callback, context });
    },
    
    off(event, callback = null) {
        if (!this._listeners[event]) return;
        if (!callback) { this._listeners[event] = []; return; }
        this._listeners[event] = this._listeners[event].filter(item => item.callback !== callback);
    },
    
    emit(event, data) {
        if (!this._listeners[event]) return;
        this._listeners[event].forEach(({ callback, context }) => {
            try { callback.call(context, data); }
            catch (e) { console.error(`[EventBus] 事件处理错误: ${event}`, e); }
        });
    },
    
    once(event, callback, context = null) {
        const wrapper = (data) => { callback.call(context, data); this.off(event, wrapper); };
        this.on(event, wrapper);
    }
};

// ========== ③-1 核心引擎：WordBankLoader ==========
const WordBankLoader = {
    
    getWordsForLevel(level) {
        const words = [...currentWords];
        if (level === 1) {
            // L1 优先返回有 emoji 或 imgPath 的词（视觉优先）
            words.sort((a, b) => {
                const aHas = (a.emoji || a.imgPath) ? 1 : 0;
                const bHas = (b.emoji || b.imgPath) ? 1 : 0;
                return bHas - aHas;
            });
        }
        return words;
    },
    
    getWordInfo(word) {
        const w = word.toLowerCase();
        const bank = currentLevelVocab || UNIT1_VOCAB;
        const found = bank.find(item => item.en.toLowerCase() === w);
        return found || null;
    },
    
    generateOptions(correctWord, level, usedWords) {
        const bank = currentLevelVocab || UNIT1_VOCAB;
        const correctInfo = this.getWordInfo(correctWord);
        if (!correctInfo) return [{ ...correctInfo || { en: correctWord, emoji: '', cn: correctWord, isCorrect: true } }];
        
        // 构建候选池：排除上一题用过的词 + 当前正确答案
        const usedSet = new Set((usedWords || []).map(w => w.toLowerCase()));
        usedSet.add(correctWord.toLowerCase());
        
        let candidates = bank.filter(item => !usedSet.has(item.en.toLowerCase()));
        
        // L1 优先选有 emoji/imgPath 的词
        if (level === 1) {
            const visualCandidates = candidates.filter(c => c.emoji || c.imgPath);
            if (visualCandidates.length >= 3) candidates = visualCandidates;
        }
        
        // 随机选3个干扰项
        const distractors = [];
        const shuffled = [...candidates].sort(() => Math.random() - 0.5);
        for (const c of shuffled) {
            if (distractors.length >= 3) break;
            distractors.push(c);
        }
        
        // 兜底：候选池不足3个时，从全单元随机补
        if (distractors.length < 3) {
            const fallback = bank.filter(item => 
                item.en.toLowerCase() !== correctWord.toLowerCase() &&
                !distractors.some(d => d.en === item.en)
            );
            const fbShuffled = [...fallback].sort(() => Math.random() - 0.5);
            for (const c of fbShuffled) {
                if (distractors.length >= 3) break;
                distractors.push(c);
            }
        }
        
        // 合并正确答案 + 干扰项，随机打乱
        const options = [
            { ...correctInfo, isCorrect: true },
            ...distractors.map(d => ({ ...d, isCorrect: false }))
        ].sort(() => Math.random() - 0.5);
        
        return options;
    }
};

// ========== ③-1 核心引擎：LevelFlowManager ==========
const LevelFlowManager = {
    
    checkLevelComplete() {
        return currentQuestionIndex >= questionOrder.length;
    },
    
    getProgress() {
        const progress = unitProgress[currentUnit] || {};
        return {
            l1Completed: progress.l1Completed || false,
            l2Completed: progress.l2Completed || false,
            l3Completed: progress.l3Completed || false,
            l1Stars: progress.l1Stars || 0,
            l2Stars: progress.l2Stars || 0,
            l3Stars: progress.l3Stars || 0
        };
    },
    
    calculateLevelResult(level) {
        const score = level === 1 ? l1Score : level === 2 ? l2Score : l3Score;
        const stars = level === 1 ? l1Stars : level === 2 ? l2Stars : l3Stars;
        const levelResults = questionResults.filter(r => r.level === level);
        const correctCount = levelResults.filter(r => r.score > 0).length;
        const totalCount = questionOrder.length;
        
        return { score, stars, correctCount, totalCount, questionResults: levelResults };
    },
    
    nextQuestion() {
        currentQuestionIndex++;
        const completed = this.checkLevelComplete();
        if (!completed) {
            EventBus.emit('question:next', { questionIndex: currentQuestionIndex });
        }
        return { completed };
    }
};

// ========== ③-3 计分系统 ScoreSystem ==========
const ScoreSystem = {
    
    recordScore(questionIndex, score) {
        recordQuestionScore(questionIndex, score);
        EventBus.emit('score:update', {
            questionIndex, score,
            levelScore: currentLevel === 1 ? l1Score : currentLevel === 2 ? l2Score : l3Score
        });
    },
    
    calculateLevelResult(level) {
        recalcLevelScore(level);
        return LevelFlowManager.calculateLevelResult(level);
    },
    
    calculateFinalResult() {
        calculateTotalScore();
        calculateTotalStars();
        return {
            totalScore,
            totalStars,
            breakdown: {
                l1: { score: l1Score, stars: l1Stars, weight: 0.3 },
                l2: { score: l2Score, stars: l2Stars, weight: 0.3 },
                l3: { score: l3Score, stars: l3Stars, weight: 0.4 }
            }
        };
    },
    
    getHighScore(unitId) {
        const progress = unitProgress[unitId] || {};
        return progress.bestTotalScore || 0;
    },
    
    // 获取指定关卡的每题最高分数组
    getScoresByLevel(level) {
        // 如果当前关卡就是目标关卡，直接返回questionBestScores
        const currentLevelNum = currentLevel === 'l1' ? 1 : currentLevel === 'l2' ? 2 : currentLevel === 'l3' ? 3 : 0;
        if (currentLevelNum === level) {
            return [...questionBestScores];
        }
        // 否则从localStorage或其他存储获取（V1.0暂不实现跨关卡查询）
        return [];
    }
};

// ========== ③-3 L1 听音选图引擎 ==========
const L1Engine = {
    _attemptCount: 0,
    _excludedOptions: [],
    _questionAnswered: false,
    _lastUsedWords: [],
    
    init(words) {
        console.log('[L1Engine] 初始化，词库:', words.length, '词');
        this._attemptCount = 0;
        this._excludedOptions = [];
        this._questionAnswered = false;
        this._lastUsedWords = [];
        generateQuestionOrder(1);
        currentQuestionIndex = 0;
        EventBus.emit('question:start', { questionIndex: 0, totalQuestions: questionOrder.length });
    },
    
    getCurrentQuestion() {
        if (currentQuestionIndex >= questionOrder.length) return null;
        // questionOrder 存的是索引，需要从 currentUnitWords 取实际单词
        const wordIndex = questionOrder[currentQuestionIndex];
        const bank = currentUnitWords.length > 0 ? currentUnitWords : (currentLevelVocab || UNIT1_VOCAB);
        const wordObj = bank[wordIndex];
        if (!wordObj) return null;
        const targetWord = wordObj.en || wordObj.word || wordObj;
        const options = WordBankLoader.generateOptions(targetWord, 1, this._lastUsedWords);
        this._lastUsedWords = options.map(o => o.en || o.word);
        
        return {
            questionIndex: currentQuestionIndex,
            totalQuestions: questionOrder.length,
            targetWord,
            options,
            usedWords: this._lastUsedWords
        };
    },
    
    selectOption(optionIndex) {
        const question = this.getCurrentQuestion();
        if (!question || this._questionAnswered) return null;
        
        const selected = question.options[optionIndex];
        const isFirstAttempt = this._attemptCount === 0;
        let score = 0;
        
        if (selected.isCorrect) {
            score = isFirstAttempt ? 100 : 50;
            this._questionAnswered = true;
            ScoreSystem.recordScore(currentQuestionIndex, score);
            EventBus.emit('question:correct', { score, isFirstAttempt, totalScore: l1Score });
        } else {
            this._excludedOptions.push(optionIndex);
            this._attemptCount++;
            EventBus.emit('question:wrong', {
                selectedWord: selected.word,
                correctWord: question.targetWord
            });
        }
        
        return {
            isCorrect: selected.isCorrect,
            correctWord: question.targetWord,
            selectedWord: selected.word,
            score,
            isFirstAttempt
        };
    },
    
    nextQuestion() {
        this._attemptCount = 0;
        this._excludedOptions = [];
        this._questionAnswered = false;
        const result = LevelFlowManager.nextQuestion();
        if (!result.completed) {
            EventBus.emit('question:start', { questionIndex: currentQuestionIndex, totalQuestions: questionOrder.length });
        }
        return result;
    },
    
    retryQuestion() {
        this._attemptCount = 0;
        this._excludedOptions = [];
        this._questionAnswered = false;
        EventBus.emit('question:retry', { questionIndex: currentQuestionIndex });
    },
    
    playPronunciation() {
        const question = this.getCurrentQuestion();
        if (!question) return;
        // TODO: 调用TTS播放发音（1b阶段实现）

    }
};

    _attemptCount: 0,
    
    async init(words) {

        this._questionAnswered = false;
        this._lastASRResult = null;
        this._attemptCount = 0;
        
        // 检测语音识别可用性

        // 确保 currentUnitWords 有数据（generateQuestionOrder 依赖它）

            currentUnitWords = words;
        }
        
        generateQuestionOrder();
        currentQuestionIndex = 0;
        EventBus.emit('question:start', { questionIndex: 0, totalQuestions: questionOrder.length });
    },
    
    async _checkASRAvailability() {
        // 两层检测方案已集成到ASRManager.init()中
        // 直接调用ASRManager的初始化，它会自动执行两层检测
        const result = await ASRManager.init();
        return result;
    },
    
    getCurrentQuestion() {
        if (currentQuestionIndex >= questionOrder.length) return null;
        // questionOrder 存的是索引，需要从 currentUnitWords 取实际单词
        const wordIndex = questionOrder[currentQuestionIndex];
        const bank = currentUnitWords.length > 0 ? currentUnitWords : (currentLevelVocab || UNIT1_VOCAB);
        const wordObj = bank[wordIndex];
        if (!wordObj) return null;
        const targetWord = wordObj.en || wordObj.word || wordObj;
        const wordInfo = WordBankLoader.getWordInfo(targetWord);
        
        const base = {
            questionIndex: currentQuestionIndex,
            totalQuestions: questionOrder.length,
            targetWord,
            displayEmoji: wordInfo ? wordInfo.emoji : '',
            displayChinese: wordInfo ? wordInfo.cn || wordInfo.chinese : targetWord,
            syllables: wordInfo ? (wordInfo.syllables || []) : [],
            phonetic: wordInfo ? (wordInfo.phonetic || '') : '',
            isFallbackMode: this._isFallbackMode
        };
        
        if (this._isFallbackMode) {
            base.options = WordBankLoader.generateOptions(targetWord, 2, []);
        }
        
        return base;
    },
    
    async startRecognition() {
        if (this._isFallbackMode || this._questionAnswered) return null;
        const question = this.getCurrentQuestion();
        if (!question) return null;
        
        this._isRecording = true;
        EventBus.emit('asr:start', { targetWord: question.targetWord });
        
        // 调用ASRManager进行真实语音识别
        const result = await ASRManager.start(question.targetWord);
        
        this._isRecording = false;
        this._lastASRResult = result;
        
        if (result.score > 0) {
            this._questionAnswered = true;
            ScoreSystem.recordScore(currentQuestionIndex, result.score);
        }
        
        EventBus.emit('asr:result', result);
        return result;
    },
    
    selectOption(optionIndex) {
        if (!this._isFallbackMode || this._questionAnswered) return null;
        const question = this.getCurrentQuestion();
        if (!question) return null;
        
        const selected = question.options[optionIndex];
        const isFirstAttempt = this._attemptCount === 0;
        let score = 0;
        
        if (selected.isCorrect) {
            score = isFirstAttempt ? 100 : 50;
            this._questionAnswered = true;
            ScoreSystem.recordScore(currentQuestionIndex, score);
            EventBus.emit('question:correct', { score, isFirstAttempt, totalScore: l2Score });
        } else {
            this._attemptCount++;
            EventBus.emit('question:wrong', {
                selectedWord: selected.word,
                correctWord: question.targetWord
            });
        }
        
        return {
            isCorrect: selected.isCorrect,
            correctWord: question.targetWord,
            selectedWord: selected.word,
            score,
            isFirstAttempt
        };
    },
    
    toggleMode() {
        if (!this._asrAvailable) return { isFallbackMode: true };
        this._isFallbackMode = !this._isFallbackMode;
        EventBus.emit('asr:mode-switch', { isFallbackMode: this._isFallbackMode });
        return { isFallbackMode: this._isFallbackMode };
    },
    
    nextQuestion() {
        this._questionAnswered = false;
        this._lastASRResult = null;
        this._attemptCount = 0;
        const result = LevelFlowManager.nextQuestion();
        if (!result.completed) {
            EventBus.emit('question:start', { questionIndex: currentQuestionIndex, totalQuestions: questionOrder.length });
        }
        return result;
    },
    
    retryQuestion() {
        this._questionAnswered = false;
        this._lastASRResult = null;
        this._attemptCount = 0;
        EventBus.emit('question:retry', { questionIndex: currentQuestionIndex });
    },
    
    showPhonics() {
        const question = this.getCurrentQuestion();
        if (!question) return null;
        const wordInfo = WordBankLoader.getWordInfo(question.targetWord);
        
        const colors = ['#1E88E5', '#E53935', '#43A047', '#FB8C00', '#8E24AA', '#E91E63'];
        const syllables = wordInfo ? (wordInfo.syllables || [question.targetWord]) : [question.targetWord];
        const syllableColors = syllables.map((_, i) => colors[i % colors.length]);
        
        return {
            word: question.targetWord,
            syllables,
            colors: syllableColors,
            chinese: wordInfo ? wordInfo.chinese : question.targetWord
        };
    },
    
    // 获取总分
    getTotalScore() {
        const total = ScoreSystem.getScoresByLevel(2);
        if (total.length === 0) return 0;
        const sum = total.reduce((s, score) => s + score, 0);
        return Math.round(sum / total.length);
    },
    
    // 获取星级（使用全局统一标准）
    getStars() {
        const score = this.getTotalScore();
        return calculateStars(score);
    }
};

// ========== ③-2 ASRManager 语音识别管理器（🟡骨架→1b增强） ==========
const ASRManager = {
    _recognition: null,
    _available: null,
    _isStopping: false, // 防抖锁，防止多次调用stop()
    _SpeechRecognition: null, // 保存构造函数供重置使用
    
    async init() {
        // 第一层：检测API是否存在
        this._SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!this._SpeechRecognition) {
            this._available = false;
            return false;
        }
        
        try {
            this._recognition = new this._SpeechRecognition();
            this._recognition.lang = 'en-US';
            this._recognition.continuous = false;
            this._recognition.interimResults = false;
            
            // 第二层：尝试实际启动ASR测试（1b增强）
            const testResult = await this._testASRStartup();
            if (!testResult) {
                this._available = false;
                return false;
            }
            
            this._available = true;
            return true;
        } catch (e) {
            console.error('[ASRManager] 初始化失败:', e);
            this._available = false;
            return false;
        }
    },
    
    // 1b增强：第二层检测 - 实际启动ASR测试
    async _testASRStartup() {
        return new Promise((resolve) => {
            if (!this._recognition) {
                resolve(false);
                return;
            }
            
            let resolved = false;
            const timeout = setTimeout(() => {
                if (!resolved) {
                    resolved = true;
                    console.warn('[ASRManager] 启动测试超时，判定为不可用');
                    this.stop();
                    resolve(false);
                }
            }, 3000); // 3秒超时
            
            this._recognition.onstart = () => {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timeout);
                    console.log('[ASRManager] 启动测试成功，语音识别可用');
                    this.stop();
                    resolve(true);
                }
            };
            
            this._recognition.onerror = (event) => {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timeout);
                    console.error('[ASRManager] 启动测试失败:', event.error);
                    resolve(false);
                }
            };
            
            try {
                this._recognition.start();
            } catch (e) {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(timeout);
                    console.error('[ASRManager] 启动异常:', e);
                    resolve(false);
                }
            }
        });
    },
    
    async start(targetWord) {
        if (!this._available || !this._recognition) {
            return { recognized: '', similarity: 0, tier: 'retry', score: 0, feedback: '语音识别不可用' };
        }
        
        // 重置识别实例（1b增强：onend后重置）
        this._isStopping = false;
        
        return new Promise((resolve) => {
            let resolved = false;
            const safeResolve = (result) => {
                if (!resolved) {
                    resolved = true;
                    resolve(result);
                }
            };
            
            this._recognition.onresult = (event) => {
                const recognized = event.results[0][0].transcript.trim().toLowerCase();
                const result = this._calculateSimilarity(recognized, targetWord);
                safeResolve(result);
            };
            
            this._recognition.onerror = (event) => {
                console.error('[ASRManager] 识别错误:', event.error);
                // 1b增强：no-speech特殊处理
                if (event.error === 'no-speech') {
                    safeResolve({ recognized: '', similarity: 0, tier: 'retry', score: 0, feedback: '🔇 没有听到声音，再试一次！' });
                } else {
                    safeResolve({ recognized: '', similarity: 0, tier: 'retry', score: 0, feedback: '识别失败' });
                }
            };
            
            this._recognition.onend = () => {
                // 1b增强：onend状态重置
                this._isStopping = false;
                // 如果还没resolve（异常情况），给一个默认结果
                safeResolve({ recognized: '', similarity: 0, tier: 'retry', score: 0, feedback: '识别结束' });
            };
            
            try {
                this._recognition.start();
            } catch (e) {
                console.error('[ASRManager] 启动失败:', e);
                safeResolve({ recognized: '', similarity: 0, tier: 'retry', score: 0, feedback: '启动失败' });
            }
        });
    },
    
    stop() {
        if (this._recognition && !this._isStopping) {
            this._isStopping = true; // 1b增强：防抖锁
            try { 
                this._recognition.stop(); 
            } catch (e) { 
                console.warn('[ASRManager] stop异常:', e);
                this._isStopping = false;
            }
        }
    },
    
    isAvailable() {
        return this._available === true;
    },
    
    _calculateSimilarity(recognized, target) {
        // 编辑距离算法（Levenshtein Distance）
        const r = recognized.toLowerCase().replace(/[^a-z]/g, '');
        const t = target.toLowerCase();
        
        if (r === t) {
            return { recognized, similarity: 1, tier: 'perfect', score: 100, feedback: '🌟 完美！' };
        }
        
        const dist = this._editDistance(r, t);
        const maxLen = Math.max(r.length, t.length);
        const similarity = maxLen > 0 ? 1 - dist / maxLen : 0;
        
        let tier, score, feedback;
        if (similarity >= 0.8) { tier = 'excellent'; score = 80; feedback = '👏 很棒！'; }
        else if (similarity >= 0.6) { tier = 'good'; score = 60; feedback = '👍 不错！'; }
        else if (similarity >= 0.3) { tier = 'effort'; score = 40; feedback = '💪 加油！'; }
        else { tier = 'retry'; score = 20; feedback = '🔄 再试一次！'; }
        
        // 短词保底：3字母及以下，最低3档(60分)
        if (t.length <= 3 && score < 60) {
            score = 60;
            tier = 'good';
            feedback = '👍 不错！';
        }
        
        return { recognized, similarity, tier, score, feedback };
    },
    
    _editDistance(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b[i-1] === a[j-1]) {
                    matrix[i][j] = matrix[i-1][j-1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i-1][j-1] + 1,
                        matrix[i][j-1] + 1,
                        matrix[i-1][j] + 1
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }
};

// ========== 1b-模块3：TTS发音-有道词典+降级（🟢Section九） ==========
let _speakAudio = null;
function speakWord(word, speed = 1.0) {
    const isWechat = /MicroMessenger/i.test(navigator.userAgent);
    if (!_speakAudio) {
        _speakAudio = new Audio();
        _speakAudio.volume = 1.0;
    }
    _speakAudio.pause();
    _speakAudio.currentTime = 0;
    _speakAudio.src = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=2`;
    const playPromise = _speakAudio.play();
    if (playPromise !== undefined) {
        playPromise.catch(() => {
            if ('speechSynthesis' in window) {
                if (isWechat) speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9 * speed;
                utterance.pitch = 1;
                speechSynthesis.speak(utterance);
            }
        });
    }
}

// ========== 1b-模块4：音效系统-AudioContext（🟢Section十·消消乐科技风） ==========
function playCorrectSound() {
    AudioManager.ensureContext();
    const ctx = AudioManager.audioContext, now = ctx.currentTime;
    // 主音效 - 电子上升音（消消乐风格）
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

function initBGMAudio(levelKey) {
    const path = BGM_PATHS[levelKey] || BGM_PATHS.home;
    if (!AudioManager.bgmAudio) {
        AudioManager.bgmAudio = new Audio(path);
        AudioManager.bgmAudio.loop = true;
        AudioManager.bgmAudio.volume = 0.35;
    } else if (AudioManager.currentBGMKey !== levelKey) {
        AudioManager.bgmAudio.pause();
        AudioManager.bgmAudio.src = path;
    }
    AudioManager.currentBGMKey = levelKey;
    return AudioManager.bgmAudio;
}

function startBGM(levelKey) {
    if (AudioManager.bgmPlaying) return;
    const audio = initBGMAudio(levelKey);
    const isWechat = /MicroMessenger/i.test(navigator.userAgent);
    if (isWechat && typeof WeixinJSBridge !== 'undefined') {
        WeixinJSBridge.invoke('getNetworkType', {}, () => {
            audio.play().then(() => {
                AudioManager.bgmPlaying = true;
                updateBGMButton();
            }).catch(e => console.log('微信BGM播放失败:', e));
        });
        return;
    }
    const playPromise = audio.play();
    if (playPromise !== undefined) {
        playPromise.then(() => {
            AudioManager.bgmPlaying = true;
            updateBGMButton();
        }).catch(e => console.log('BGM播放需要用户交互:', e));
    }
}

function stopBGM() {
    if (AudioManager.bgmAudio) {
        AudioManager.bgmAudio.pause();
        AudioManager.bgmAudio.currentTime = 0;
    }
    AudioManager.bgmPlaying = false;
    updateBGMButton();
}

function dataURLtoBlob(dataUrl) {
    const arr = dataUrl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) { u8arr[n] = bstr.charCodeAt(n); }
    return new Blob([u8arr], { type: mime });
}

// ========== 1b-模块9：自定义词库解析（🟡Section八·适配新数据结构） ==========
function parseCustomVocab(text) {
    const lines = text.trim().split('\n');
    const vocabList = [];
    const errors = [];
    lines.forEach((line, index) => {
        line = line.trim();
        if (!line) return;
        let parts = null;
        if (line.includes('\t')) parts = line.split('\t');
        else if (line.includes('，')) parts = line.split('，');
        else if (line.includes(',')) parts = line.split(',');
        else if (line.includes('：')) parts = line.split('：');
        else if (line.includes(':')) parts = line.split(':');
        else if (line.includes('；')) parts = line.split('；');
        else if (line.includes(';')) parts = line.split(';');
        if (parts && parts.length >= 2) {
            const wordRaw = parts[0].trim();
            const wordLower = wordRaw.toLowerCase();
            const chinese = parts[1].trim();
            const customEmoji = parts[2] ? parts[2].trim() : '';
            if (wordRaw && chinese) {
                const emoji = customEmoji || getVocabEmoji(wordLower);
                vocabList.push({
                    word: wordRaw, enRaw: wordRaw, emoji: emoji,
                    imgPath: '', chinese: chinese,
                    phonemes: [], sounds: [], syllables: [],
                    category: 'custom', difficulty: 1
                });
            } else {
                errors.push(`第${index + 1}行：格式错误`);
            }
        } else {
            errors.push(`第${index + 1}行：无法解析，请用Tab/逗号/冒号分隔`);
        }
    });
    // 自动去重（按word小写去重）
    const seen = new Set();
    const dedupedList = vocabList.filter(item => {
        const key = item.word.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });
    // 最低词汇量验证（4词下限，L1四选一需要）
    if (dedupedList.length < 4) {
        errors.push(`词汇量不足：至少需要4个单词，当前只有${dedupedList.length}个`);
    }
    return { vocabList: dedupedList, errors };
}

// ========== 1b-模块11：UI控制（🟡Section十二·Toast+洗牌+全屏+星星粒子+Canvas兼容） ==========
function showToast(message, type = 'info', duration = 3000) {
    const existing = document.querySelector('.ui__toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'ui__toast';
    toast.textContent = message;
    // 根据type设置文字颜色：success绿色、error红色、info白色
    const colorMap = { success: '#66BB6A', error: '#EF5350', info: '#fff' };
    const color = colorMap[type] || '#fff';
    const fontSize = message.length > 10 ? '14px' : '16px';
    toast.style.cssText = `position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:${color};padding:12px 24px;border-radius:8px;font-size:${fontSize};font-weight:700;z-index:10000;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;`;
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.style.opacity = '1'; });
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initFullscreen() {
    const btn = document.querySelector('.header__fullscreen-toggle');
    if (!btn) return;
    btn.addEventListener('click', () => {
        const isWechat = /MicroMessenger/i.test(navigator.userAgent);
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            const el = document.documentElement;
            const requestFn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (requestFn) {
                requestFn.call(el).then(() => btn.classList.add('active')).catch(err => {
                    if (isWechat) showToast('微信不支持全屏，请用浏览器打开');
                });
            } else if (isWechat) {
                showToast('微信不支持全屏，请用浏览器打开');
            }
        } else {
            const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (exitFn) exitFn.call(document).then(() => btn.classList.remove('active'));
        }
    });
}

// Canvas圆角矩形兼容函数（旧版Safari兼容）
function drawRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

  if (AudioManager.audioContext && AudioManager.audioContext.state === 'suspended') {

  currentUnit = unitId;
  selectedUnit = unitId;

  gameState.lastLevel = 'l1';

  StorageMgr.set('savedGame', {
    unitId: unitId,

}

// --- 继续游戏 ---
function resumeGame() {
  var savedGame = StorageMgr.get('savedGame', null);
  if (!savedGame || !savedGame.currentLevel || !savedGame.unitId) {
    alert('没有找到未完成的游戏进度');
    return;
  }
  // 解锁音频上下文
  if (AudioManager.audioContext && AudioManager.audioContext.state === 'suspended') {
    AudioManager.audioContext.resume();
  }
  currentUnit = savedGame.unitId;
  selectedUnit = savedGame.unitId;
  initGameState(savedGame.unitId);
  // BUG4修复: 恢复已完成关卡的成绩（initGameState会重置所有分数）
  if (savedGame.levelScores) { levelScores = savedGame.levelScores; }
  if (savedGame.levelStars) { levelStars = savedGame.levelStars; }
  if (savedGame.levelTimeSpent) { levelTimeSpent = savedGame.levelTimeSpent; }
  gameState.currentLevel = savedGame.currentLevel;
  gameState.lastLevel = savedGame.currentLevel;
  navigate('/' + savedGame.currentLevel, { unit: savedGame.unitId });
}

// --- 导入词库 CSV ---
function importWordCSV() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv,.txt';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var text = ev.target.result;
        var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
        var words = [];
        var startIdx = (lines[0] && (lines[0].indexOf('单词') >= 0 || lines[0].toLowerCase().indexOf('word') >= 0)) ? 1 : 0;
        for (var i = startIdx; i < lines.length; i++) {
          var parts = lines[i].split(/[,\t;]/).map(function(s) { return s.trim().replace(/^["']|["']$/g, ''); });
          if (parts.length >= 2 && parts[0]) {
            words.push({ en: parts[0], zh: parts[1], emoji: parts[2] || '' });
          }
        }
        if (words.length === 0) {
          alert('未能从文件中解析出有效的单词数据，请确保格式为：单词,中文[,emoji]');
          return;
        }
        var customUnitId = 'custom-' + Date.now();
        if (!wordBankData) wordBankData = { units: [] };
        wordBankData.units.push({
          id: customUnitId,
          name: file.name.replace(/\.[^.]+$/, ''),
          displayName: file.name.replace(/\.[^.]+$/, ''),
          words: words
        });
        selectUnit(customUnitId);
        alert('成功导入 ' + words.length + ' 个单词！');
      } catch (err) {
        alert('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// --- 导出词库 CSV ---
function exportWordCSV() {
  var unitId = selectedUnit || StorageMgr.get('selectedUnit', '') || 'pep-grade3-u1';
  var unit = null;
  if (wordBankData && wordBankData.units) {
    unit = wordBankData.units.find(function(u) { return u.id === unitId; });
  }
  if (!unit || !unit.words || unit.words.length === 0) {
    alert('当前没有可导出的词库数据');
    return;
  }

/**
 * 用大池子数据补全自定义词库的 emoji/syllables/phonetic 等字段
 * 用户输入的单词在大池子中能匹配到，就用池子的完整数据覆盖；
 * 匹配不到的保留原始解析结果，补上 phonetic 空值防止 undefined
 * @param {Array} parsedList - parseCustomVocab() 输出的词汇列表
 * @returns {Array} 补全后的词汇列表
 */
function enrichVocabFromPool(parsedList) {
    if (!poolLookupMap || Object.keys(poolLookupMap).length === 0) {
        console.warn('[自定义] 池子查找表为空，跳过补全');
        return parsedList;
    }
    return parsedList.map(function(item) {
        var key = (item.word || item.enRaw || '').toLowerCase();
        var poolItem = poolLookupMap[key];
        if (poolItem) {
            // 命中池子，用池子的完整数据覆盖（池子优先）
            return Object.assign({}, item, {
                emoji: poolItem.emoji || item.emoji || '',
                syllables: poolItem.syllables || [],
                phonetic: poolItem.phonetic || '',
                phonemes: poolItem.phonemes || [],
                sounds: poolItem.sounds || [],
                category: poolItem.category || 'custom',
                difficulty: poolItem.difficulty || 1
            });
        } else {
            // 未命中，保留原始数据，补上缺失的 phonetic 字段
            console.warn('[自定义] 词库中未找到:', key, '将使用基础数据');
            item.phonetic = item.phonetic || '';
            return item;
        }
    });
}

// 获取所有已保存的自定义词库
function getCustomVocabs() {
  return StorageMgr.get('customVocabs', []);

// 保存自定义词库到localStorage
function saveCustomVocab(name, vocabList) {
  var saved = getCustomVocabs();
  var idx = -1;
  for (var i = 0; i < saved.length; i++) {
    if (saved[i].name === name) { idx = i; break; }
  }
  var item = { name: name, vocabList: vocabList, created: Date.now() };
  if (idx >= 0) { saved[idx] = item; } else { saved.unshift(item); }
  StorageMgr.set('customVocabs', saved);
}

function confirmCustomVocabInput() {
  var textarea = document.getElementById('customVocabTextarea');
  var errorDiv = document.getElementById('customVocabError');
  if (!textarea || !errorDiv) return;

  var text = textarea.value.trim();
  if (!text) {
    errorDiv.textContent = '请输入词汇内容';
    return;
  }

  // 确保池子查找表已构建（词库已加载）
  if (!poolLookupMap || Object.keys(poolLookupMap).length === 0) {
    if (wordBankData) {
      buildPoolLookupMap();
    } else {
      loadWordBank('pep-grade3-start');
    }
  }

  // 解析
  var result = parseCustomVocab(text);

  // 用大池子数据补全 emoji/音标/音节
  result.vocabList = enrichVocabFromPool(result.vocabList);

  // 上限检查
  if (result.vocabList.length > 20) {
    errorDiv.textContent = '最多支持20个词汇，当前有' + result.vocabList.length + '个，请分批导入';
    return;
  }

  // 下限检查
  if (result.vocabList.length < 4) {
    errorDiv.textContent = '至少需要4个词汇，当前只有' + result.vocabList.length + '个';
    return;
  }

  // 解析错误（去掉下限/上限的error，因为已经单独检查了）
  var parseErrors = result.errors.filter(function(e) {
    return e.indexOf('词汇量不足') === -1;
  });
  if (parseErrors.length > 0) {
    errorDiv.innerHTML = parseErrors.slice(0, 3).join('<br>');
    if (parseErrors.length > 3) errorDiv.innerHTML += '<br>...共' + parseErrors.length + '条错误';
    return;
  }

  // 解析成功 → 弹命名窗
  window._pendingCustomVocab = result.vocabList;
  closeCustomVocabModal();
  showVocabNameModal();
}

// ========== Step2-L1 第一关游戏逻辑 ==========

// L1游戏状态
const L1 = {
  currentQuestion: 0,        // 当前题号（0-based）
  totalQuestions: 10,        // 总题数（默认10题）
  questions: [],             // 题目序列（已打乱）
  currentOptions: [],        // 当前题的4个选项
  correctAnswer: null,       // 当前题正确答案
  answered: false,           // 当前题是否已答对
  attemptCount: 0,           // 当前题尝试次数
  scores: [],                // 每题得分记录
  lastUsedWords: [],         // 上一题用过的4个词
  // #7: showGuide已移除

  
  // 初始化
  init() {
    this.currentQuestion = 0;
    this.questions = this.shuffleArray([...currentLevelVocab]);
    this.totalQuestions = Math.min(10, this.questions.length);
    this.questions = this.questions.slice(0, this.totalQuestions);
    this.scores = [];
    this.lastUsedWords = [];
    // #7: 手指指引已移除

    this.generateQuestion();
  },
  
  // 生成当前题目
  generateQuestion() {
    if (this.currentQuestion >= this.totalQuestions) {
      return; // 所有题目完成
    }
    
    // 清除所有词的错误标记，防止上一题的错误状态污染下一题
    currentLevelVocab.forEach(w => { w._wrong = false; });
    
    this.answered = false;
    this.attemptCount = 0;
    this.correctAnswer = this.questions[this.currentQuestion];
    this.currentOptions = this.generateOptions();
    this.lastUsedWords = this.currentOptions.map(opt => opt.en);
  },
  
  // 选项生成算法
  generateOptions() {
    const correct = this.correctAnswer;
    
    // 视觉优先：有emoji或imgPath的词优先
    const visualWords = currentLevelVocab.filter(w => 
      w.emoji && w.emoji !== w.cn && w.emoji.length > 0
    );
    
    // 候选池：排除上一题用过的词
    let candidates = visualWords.filter(w => 
      !this.lastUsedWords.includes(w.en) && w.en !== correct.en
    );
    
    // 如果候选池不足3个，逐级放宽
    if (candidates.length < 3) {
      candidates = visualWords.filter(w => w.en !== correct.en);
    }
    
    // 随机选3个干扰项
    const shuffled = this.shuffleArray(candidates);
    const distractors = shuffled.slice(0, 3);
    
    // 组合4个选项
    let options = [correct, ...distractors];
    
    // 随机打乱顺序
    options = this.shuffleArray(options);
    
    return options;
  },
  
  // 答题处理（#1-4: 最多2次机会）
  handleAnswer(selectedWord) {
    if (this.answered) return { correct: false, score: 0 }; // 已答对，不再处理
    
    this.attemptCount++;
    
    if (selectedWord.en === this.correctAnswer.en) {
      // 答对
      this.answered = true;
      let score = 0;
      if (this.attemptCount === 1) {
        score = 100; // 首次答对100分
      } else {
        score = 50;  // 第2次答对50分
      }
      this.scores[this.currentQuestion] = score;
      recordQuestionScore(this.currentQuestion, score);
      
      return { correct: true, score: score };
    } else {
      // 答错
      return { correct: false, score: 0 };
    }
  },
  

  // 下一题
  nextQuestion() {
    this.currentQuestion++;
    if (this.currentQuestion < this.totalQuestions) {
      this.generateQuestion();
      return true;
    }
    return false; // 所有题目完成
  },
  
  // 获取当前总分
  getTotalScore() {
    const total = this.scores.reduce((sum, score) => sum + (score || 0), 0);
    const maxScore = this.totalQuestions * 100;
    return Math.round((total / maxScore) * 100);
  },
  
  // 获取星级
  getStars() {
    const score = this.getTotalScore();
    if (score >= 90) return 5;
    if (score >= 75) return 4;
    if (score >= 60) return 3;
    if (score >= 40) return 2;
    return 1;
  },
  
  // 数组洗牌
  shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
};

// 生成L1内容
function renderL1(deviceType) {
  // 确保L1已初始化
  if (!L1.currentOptions || L1.currentOptions.length === 0) {
    initL1();
  }
  
  const currentQ = L1.currentQuestion + 1;
  const totalQ = L1.totalQuestions;
  const progress = (currentQ / totalQ) * 100;
  const options = L1.currentOptions;
  const correct = L1.correctAnswer;
  const answered = L1.answered;
  const attemptCount = L1.attemptCount;
  const maxAttempts = 2;
  const attemptsLeft = maxAttempts - attemptCount;
  
  // ABCD标签
  const labels = ['A', 'B', 'C', 'D'];
  
  // 生成选项HTML
  let optionsHTML = '';
  // 答案反馈区（答对/2次错后显示单个居中大格子）
  let feedbackHTML = '';
  
  // 辅助函数：生成单个格子的emoji HTML
  function buildEmojiHTML(word, isBig) {
    const emoji = word.emoji || word.cn;
    const isChineseFallback = !word.emoji || /[\u4e00-\u9fff]/.test(word.emoji);
    if (isBig) {
      let cls, content;
      if (isChineseFallback) {
        if (word.cn.includes('；')) {
          cls = 'class="big-emoji chinese-fallback emoji-multi"';
          const parts = word.cn.split('；');
          content = parts.map((p, i) => '<span>' + p + (i < parts.length - 1 ? '；' : '') + '</span>').join('');
        } else {
          cls = 'class="big-emoji chinese-fallback"';
          content = word.cn;
        }
      } else {
        const chars = Array.from(emoji);
        cls = chars.length > 1 ? 'class="big-emoji emoji-multi"' : 'class="big-emoji"';
        content = emoji;
      }
      return { cls, content, isChineseFallback };
    } else {
      let cls, content;
      if (isChineseFallback) {
        if (word.cn.includes('；')) {
          cls = 'class="img-emoji chinese-fallback emoji-multi" style="font-size:28px;"';
        } else {
          cls = 'class="img-emoji chinese-fallback" style="font-size:38px;"';
        }
      } else {
        const chars = Array.from(emoji);
        cls = chars.length > 1 ? 'class="img-emoji emoji-multi" style="font-size:28px;"' : 'class="img-emoji" style="font-size:38px;"';
      }
      return { cls, content: emoji, isChineseFallback };
    }
  }

  if (answered) {
    // 答对/2次错后：新页面效果，只显示正确答案大格子
    const big = buildEmojiHTML(correct, true);
    feedbackHTML = `
      <div style="display:flex; justify-content:center; margin: 8px auto 0;">
        <div class="big-img-box correct-highlight" style="flex: 0 0 auto; width: 85%; max-width: 260px; aspect-ratio: 1/1;">
          <div ${big.cls}>${big.content}</div>
          ${!big.isChineseFallback ? `<div class="chinese-overlay"><span>${correct.cn}</span></div>` : ''}
        </div>
      </div>
      <div class="l1-answer-feedback" style="flex: 0 0 auto; text-align: center; margin-top: 16px;">
        <div class="word-display" style="padding: 0;">
          <div class="word">${correct.syllables && correct.syllables.length > 0 ? correct.syllables.map((s, i) => `<span style="color:${['#1E88E5','#E53935','#43A047','#FB8C00','#8E24AA','#E91E63'][i % 6]}">${s}</span>`).join('') : correct.en}</div>
          ${correct.phonetic ? `<div class="syllables">/${correct.phonetic}/</div>` : ''}
        </div>
      </div>
    `;
  } else {
    // 未答题：正常4格布局
    options.forEach((word, idx) => {
      const label = labels[idx];
