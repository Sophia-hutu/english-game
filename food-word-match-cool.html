        function updateScore() {
            document.getElementById('scoreDisplay').textContent = gameState.score;
        }

        function updateCombo() {
            document.getElementById('comboDisplay').textContent = gameState.combo;
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ==================== 计时器 ====================
        function startTimer() {
            const config = getLevelConfig(gameState.currentLevel);
            gameState.timeLeft = config.time;
            
            const timerFill = document.getElementById('timerFill');
            const timerText = document.getElementById('timerText');
            
            timerFill.style.width = '100%';
            timerFill.className = 'timer-fill';
            timerText.className = 'timer-text';
            timerText.textContent = gameState.timeLeft;
            
            clearInterval(gameState.timerInterval);
            
            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                timerText.textContent = gameState.timeLeft;
                
                const percent = (gameState.timeLeft / config.time) * 100;
                timerFill.style.width = percent + '%';
                
                if (gameState.timeLeft <= 10) {
                    timerFill.className = 'timer-fill danger';
                    timerText.className = 'timer-text danger';
                } else if (gameState.timeLeft <= 20) {
                    timerFill.className = 'timer-fill warning';
                }
                
                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    gameOver(false);
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(gameState.timerInterval);
        }

        // ==================== 生成游戏网格 ====================
        function generateGrid() {
            const config = getLevelConfig(gameState.currentLevel);
            const shuffled = shuffleArray(getCurrentVocabulary());
            const selectedVocab = shuffled.slice(0, config.pairs);
            
            let cells = [];
            selectedVocab.forEach(vocab => {
                cells.push({ type: 'en', text: vocab.en, vocab: vocab });
                cells.push({ type: 'cn', text: vocab.cn, vocab: vocab });
            });
            
            cells = shuffleArray(cells);
            
            cells.forEach((cell, index) => {
                cell.id = index;
            });
            
            return cells;
        }

        function renderGrid() {
            const config = getLevelConfig(gameState.currentLevel);
            const grid = document.getElementById('gameGrid');
            
            grid.className = 'game-grid';
            if (config.cols === 4 && config.rows === 3) {
                grid.classList.add('grid-4x3');
            } else if (config.cols === 4 && config.rows === 4) {
                grid.classList.add('grid-4x4');
            } else if (config.cols === 4 && config.rows === 5) {
                grid.classList.add('grid-4x5');
            }
            
            grid.innerHTML = gameState.cells.map(cell => {
                let content = '';
                
                if (cell.type === 'en') {
                    content = '<span class="cell-text">' + cell.text + '</span>';
                } else {
                    // 中文格子：优先使用emoji，如果没有emoji则显示中文文字
                    const emoji = cell.vocab.emoji || getVocabEmoji(cell.vocab.en);
                    const hasImg = cell.vocab.imgPath;
                    
                    if (hasImg && emoji !== '✏') {
                        // 有图片时用图片，fallback到emoji
                        content = `<img class="cell-image" src="${cell.vocab.imgPath}" alt="${cell.text}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="cell-emoji" style="display:none;">${emoji}</span>`;
                    } else if (emoji !== '✏') {
                        // 有emoji则显示emoji
                        content = '<span class="cell-emoji">' + emoji + '</span>';
                    } else {
                        // 没有emoji则显示中文文字
                        content = '<span class="cell-emoji">✏</span><span class="cell-cn-text">' + cell.text + '</span>';
                    }
                }
                
                return `
                    <div class="grid-cell ${cell.type}" data-id="${cell.id}" data-type="${cell.type}" data-vocab-en="${cell.vocab.en}">
                        ${content}
                    </div>
                `;
            }).join('');
            
            grid.querySelectorAll('.grid-cell').forEach(cellEl => {
                cellEl.addEventListener('click', () => handleCellClick(cellEl));
            });
        }

        // ==================== 处理格子点击 ====================
        function handleCellClick(cellEl) {
            if (gameState.isLocked) return;
            if (cellEl.classList.contains('gone')) return;
            
            const cellId = parseInt(cellEl.dataset.id);
            const cell = gameState.cells.find(c => c.id === cellId);
            
            if (gameState.selectedCell && gameState.selectedCell.id === cellId) {
                cellEl.classList.remove('selected');
                gameState.selectedCell = null;
                return;
            }
            
            if (!gameState.selectedCell) {
                cellEl.classList.add('selected');
                gameState.selectedCell = cell;
                return;
            }
            
            const firstCell = gameState.selectedCell;
            const firstEl = document.querySelector(`[data-id="${firstCell.id}"]`);
            
            const isMatch = (
                firstCell.type !== cell.type && 
                firstCell.vocab.en === cell.vocab.en
            );
            
            if (isMatch) {
                handleMatch(firstEl, cellEl, firstCell, cell);
            } else {
                handleMismatch(firstEl, cellEl, firstCell, cell);
            }
            
            firstEl.classList.remove('selected');
            gameState.selectedCell = null;
        }

        function handleMatch(el1, el2, cell1, cell2) {
            gameState.isLocked = true;
            playCorrectSound();
            
            speakWord(cell1.vocab.en);
            
            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) {
                gameState.maxCombo = gameState.combo;
            }
            
            let points = 10;
            if (gameState.combo >= 3) {
                points += gameState.combo;
            } else if (gameState.combo === 2) {
                points += 5;
            }
            gameState.score += points;
            gameState.matchCount++;
            
            updateScore();
            updateCombo();
            
            if (gameState.combo >= 2) {
                showCombo(gameState.combo);
                playComboSound(gameState.combo);
            }
            
            createStarParticles(el1);
            createStarParticles(el2);
            
            el1.classList.add('matched');
            el2.classList.add('matched');
            
            setTimeout(() => {
                el1.classList.add('gone');
                el2.classList.add('gone');
                el1.classList.remove('matched');
                el2.classList.remove('matched');
                gameState.isLocked = false;
                
                checkWin();
            }, 600);
        }

        function handleMismatch(el1, el2, cell1, cell2) {
            gameState.isLocked = true;
            playFailSound();
            
            const wrongEntry = {
                en: cell1.vocab.en,
                cn: cell1.vocab.cn,
                emoji: cell1.vocab.emoji || getVocabEmoji(cell1.vocab.en),
                imgPath: cell1.vocab.imgPath
            };
            if (!gameState.wrongQuestions.some(w => w.en === wrongEntry.en)) {
                gameState.wrongQuestions.push(wrongEntry);
            }
            
            gameState.combo = 0;
            gameState.failCount++;
            gameState.score = Math.max(0, gameState.score - 2);
            
            updateScore();
            updateCombo();
            
            el2.classList.add('selected');
            el2.classList.add('wrong');
            
            setTimeout(() => {
                el2.classList.remove('selected');
                el2.classList.remove('wrong');
                gameState.isLocked = false;
            }, 600);
        }

        function checkWin() {
            const remaining = gameState.cells.filter(cell => {
                const el = document.querySelector(`[data-id="${cell.id}"]`);
                return !el.classList.contains('gone');
            });
            
            if (remaining.length === 0) {
                gameOver(true);
            }
        }

        // ==================== 特效 ====================
        function showCombo(combo) {
            const comboEl = document.createElement('div');
            comboEl.className = 'combo-display';
            comboEl.textContent = `${combo}x COMBO`;
            document.body.appendChild(comboEl);
            
            setTimeout(() => {
                comboEl.remove();
            }, 1000);
        }

        function createStarParticles(cellEl) {
            const rect = cellEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const emojis = ['⭐', '✨', '🤖', '🌟', '🏆'];
            
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'star-particle';
                particle.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = (centerX + (Math.random() - 0.5) * 80) + 'px';
                particle.style.top = (centerY + (Math.random() - 0.5) * 80) + 'px';
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function createConfetti() {
            const colors = ['#00e5ff', '#00e676', '#ffd740', '#ff4081', '#7c4dff', '#ff1744'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // ==================== 游戏流程 ====================
        function startGame(level) {
            if (!gameState.levelUnlocked[level] && level > 1) {
                alert('请先通关前一关！');
                return;
            }
            
            const nickname = document.getElementById('nicknameInput').value.trim() || '匿名';
            gameState.nickname = nickname;
            
            initAudioContext();
            
            gameState.currentLevel = level;
            gameState.score = 0;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.matchCount = 0;
            gameState.failCount = 0;
            gameState.wrongQuestions = [];
            gameState.selectedCell = null;
            gameState.isLocked = false;
            
            gameState.cells = generateGrid();
            
            document.getElementById('levelBadge').textContent = `LEVEL ${level}`;
            document.getElementById('gameHeader').className = `game-header level-${level}`;
            
            updateScore();
            updateCombo();
            
            showLevelTransition(level);
        }

        function showLevelTransition(level) {
            const overlay = document.getElementById('transitionOverlay');
            const countdown = document.getElementById('countdownNum');
            const config = getLevelConfig(level);
            
            // 根据关卡设置不同的过渡背景
            const bgColors = {
                1: 'linear-gradient(135deg, rgba(0, 229, 255, 0.95) 0%, rgba(0, 77, 64, 0.95) 100%)',
                2: 'linear-gradient(135deg, rgba(0, 230, 118, 0.95) 0%, rgba(0, 77, 64, 0.95) 100%)',
                3: 'linear-gradient(135deg, rgba(255, 215, 64, 0.95) 0%, rgba(0, 77, 64, 0.95) 100%)'
            };
            
            overlay.style.background = bgColors[level] || bgColors[1];
            
            overlay.style.display = 'flex';
            countdown.innerHTML = `
                <div class="level-intro">
                    <h2>LEVEL ${level}</h2>
                    <p>${config.rows}x${config.cols} GRID | ${config.time}S | ${config.pairs} PAIRS</p>
                </div>
            `;
            
            let count = 2;
            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdown.innerHTML = `<div class="countdown">${count}</div>`;
                } else {
                    clearInterval(countInterval);
                    overlay.style.display = 'none';
                    
                    showScreen('gameScreen');
                    renderGrid();
                    startTimer();
                }
            }, 1000);
        }

        function gameOver(success) {
            stopTimer();
            
            const config = getLevelConfig(gameState.currentLevel);
            const timeUsed = config.time - gameState.timeLeft;
            
            const resultIcon = document.getElementById('resultIcon');
            if (success) {
                resultIcon.innerHTML = '✨';
                resultIcon.className = 'result-icon victory';
            } else {
                resultIcon.innerHTML = '⚠';
                resultIcon.className = 'result-icon defeat';
            }
            
            document.getElementById('resultTitle').textContent = success ? 'MISSION COMPLETE' : 'TIME UP';
            document.getElementById('resultScore').textContent = `${gameState.score} 分`;
            document.getElementById('resultTime').textContent = `用时：${timeUsed}秒`;
            document.getElementById('matchCount').textContent = gameState.matchCount;
            document.getElementById('failCount').textContent = gameState.failCount;
            document.getElementById('maxCombo').textContent = gameState.maxCombo;
            
            if (success) {
                playVictorySound();
                createConfetti();
                
                if (gameState.currentLevel < 3) {
                    gameState.levelUnlocked[gameState.currentLevel + 1] = true;
                    saveUnlockedState();
                    updateLevelButtons();
                }
            } else {
                playDefeatSound();
            }
            
            saveScore(gameState.score, timeUsed);
            
            renderResultLeaderboard();
            renderWrongQuestions();
            
            showScreen('resultScreen');
        }

        // ==================== 排行榜 ====================
        function saveScore(score, timeUsed) {
            const scores = JSON.parse(localStorage.getItem('matchGameScores') || '[]');
            scores.push({
                nickname: gameState.nickname,
                score: score,
                time: timeUsed,
                level: gameState.currentLevel,
                vocabKey: currentVocabKey,
                date: new Date().toLocaleDateString()
            });
            
            scores.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.time - b.time;
            });
            
            const top10 = scores.slice(0, 10);
            localStorage.setItem('matchGameScores', JSON.stringify(top10));
        }

        function renderResultLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('matchGameScores') || '[]');
            const list = document.getElementById('resultLeaderboardList');
            
            if (scores.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:18px;">暂无记录</p>';
                return;
            }
            
            list.innerHTML = scores.map((s, i) => {
                const medals = [
                    '<span class="rank-medal gold">1ST</span>',
                    '<span class="rank-medal silver">2ND</span>',
                    '<span class="rank-medal bronze">3RD</span>'
                ];
                const medal = medals[i] || `<span class="rank-medal">${i + 1}.</span>`;
                return `
                    <div class="leaderboard-item">
                        ${medal}
                        <div class="rank-info">
                            <div class="rank-name">${s.nickname}</div>
                            <div class="rank-date">${s.date}</div>
                        </div>
                        <span class="rank-score">${s.score}分</span>
                        <span class="rank-time">${s.time}秒</span>
                    </div>
                `;
            }).join('');
        }

        function showLeaderboardScreen() {
            showScreen('leaderboardScreen');
            const scores = JSON.parse(localStorage.getItem('matchGameScores') || '[]');
            const list = document.getElementById('fullLeaderboardList');
            
            if (scores.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:35px;">暂无记录</p>';
                return;
            }
            
            list.innerHTML = scores.map((s, i) => {
                const medals = [
                    '<span class="rank-medal gold">1ST</span>',
                    '<span class="rank-medal silver">2ND</span>',
                    '<span class="rank-medal bronze">3RD</span>'
                ];
                const medal = medals[i] || `<span class="rank-medal">${i + 1}.</span>`;
                return `
                    <div class="leaderboard-item">
                        ${medal}
                        <div class="rank-info">
                            <div class="rank-name">${s.nickname}</div>
                            <div class="rank-date">${s.date}</div>
                        </div>
                        <span class="rank-score">${s.score}分</span>
                        <span class="rank-time">${s.time}秒</span>
                    </div>
                `;
            }).join('');
        }

        // ==================== 错题本 ====================
        function renderWrongQuestions() {
            const container = document.getElementById('wrongQuestions');
            const list = document.getElementById('wrongList');
            
            if (gameState.wrongQuestions.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            
            list.innerHTML = gameState.wrongQuestions.map(w => {
                const emoji = w.emoji || getVocabEmoji(w.en);
                const imgHtml = w.imgPath ? 
                    `<img class="wrong-image" src="${w.imgPath}" alt="${w.en}" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"><span class="wrong-icon" style="display:none;">${emoji}</span>` :
                    `<span class="wrong-icon">${emoji}</span>`;
                return `
                    <div class="wrong-item">
                        ${imgHtml}
                        <div class="wrong-info">
                            <div class="wrong-en">${w.en}</div>
                            <div class="wrong-cn">${w.cn}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function exportWrongQuestions() {
            if (gameState.wrongQuestions.length === 0) {
                return '本局无错题记录';
            }
            
            return 'FOOD MATCH - ERROR LOG\n' + 
                gameState.wrongQuestions.map((w, i) => {
                    const emoji = w.emoji || getVocabEmoji(w.en);
                    return `${i + 1}. ${emoji} ${w.en} = ${w.cn}`;
                }).join('\n') +
                '\n\n生成时间：' + new Date().toLocaleString();
        }

        function copyToClipboard() {
            const text = exportWrongQuestions();
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }

        function downloadTxt() {
            const text = exportWrongQuestions();
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '食物单词消消乐-错题本.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ==================== 词库选择相关 ====================
        function initVocabSelection() {
            const vocabTags = document.getElementById('vocabTags');
            const tags = vocabTags.querySelectorAll('.vocab-tag');
            const vocabCount = document.getElementById('vocabCount');
            const customPanel = document.getElementById('customVocabPanel');
            const customInput = document.getElementById('customVocabInput');
            const customError = document.getElementById('customVocabError');
            const confirmBtn = document.getElementById('confirmCustomVocab');
            const cancelBtn = document.getElementById('cancelCustomVocab');
            
            // 点击词库标签
            tags.forEach(tag => {
                tag.addEventListener('click', () => {
                    const vocabKey = tag.dataset.vocab;
                    
                    if (vocabKey === 'custom') {
                        // 打开自定义面板
                        customPanel.classList.add('show');
                        tag.classList.add('active');
                        vocabCount.textContent = customVocabList.length > 0 ? `${customVocabList.length}个词汇（已设置）` : '请输入词汇';
                        vocabCount.classList.add('active');
                    } else {
                        // 选择预设词库
                        customPanel.classList.remove('show');
                        tags.forEach(t => t.classList.remove('active'));
                        tag.classList.add('active');
                        currentVocabKey = vocabKey;
                        
                        const vocab = PRESET_VOCABULARIES[vocabKey];
                        vocabCount.textContent = `${vocab.length}个词汇`;
                        vocabCount.classList.remove('active');
                    }
                });
            });
            
            // 确认自定义词库
            confirmBtn.addEventListener('click', () => {
                const inputText = customInput.value.trim();
                
                if (!inputText) {
                    customError.textContent = '请输入词汇';
                    customError.classList.add('show');
                    return;
                }
                
                const { vocabList, errors } = parseCustomVocab(inputText);
                
                if (vocabList.length < 6) {
                    customError.textContent = `至少需要6个词汇，当前只有${vocabList.length}个`;
                    customError.classList.add('show');
                    return;
                }
                
                if (vocabList.length > 50) {
                    customError.textContent = '最多支持50个词汇';
                    customError.classList.add('show');
                    return;
                }
                
                if (errors.length > 0) {
                    customError.innerHTML = `以下行无法解析：<br>${errors.slice(0, 3).join('<br>')}${errors.length > 3 ? '...' : ''}`;
                    customError.classList.add('show');
                    return;
                }
                
                customVocabList = vocabList;
                currentVocabKey = 'custom';
                customError.classList.remove('show');
                vocabCount.textContent = `${vocabList.length}个词汇`;
                vocabCount.classList.add('active');
                
                // 显示成功提示
                alert(`已添加${vocabList.length}个词汇！`);
            });
            
            // 取消自定义词库
            cancelBtn.addEventListener('click', () => {
                customPanel.classList.remove('show');
                // 如果没有自定义词库，切换回食物词库
                if (customVocabList.length === 0) {
                    tags.forEach(t => {
                        t.classList.remove('active');
                        if (t.dataset.vocab === 'food') t.classList.add('active');
                    });
                    currentVocabKey = 'food';
                    vocabCount.textContent = '25个词汇';
                    vocabCount.classList.remove('active');
                }
            });
        }

        // ==================== 事件绑定 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化护眼模式
            initEyeProtection();
            
            // 初始化词库选择
            initVocabSelection();
            
            document.getElementById('backBtn').addEventListener('click', () => {
                stopTimer();
                if (confirm('确定退出游戏？')) {
                    showScreen('startScreen');
                } else {
                    startTimer();
                }
            });
            
            document.getElementById('bgmToggle').addEventListener('click', () => {
                initAudioContext();
                const btn = document.getElementById('bgmToggle');
                
                if (gameState.bgmPlaying) {
                    stopBGM();
                    btn.innerHTML = '♪';
                    btn.classList.add('muted');
                } else {
                    startBGM();
                    btn.innerHTML = '♫';
                    btn.classList.remove('muted');
                }
            });
            
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                startGame(gameState.currentLevel);
            });
            
            document.getElementById('homeBtn').addEventListener('click', () => {
                showScreen('startScreen');
            });
            
            document.getElementById('backFromLeaderboard').addEventListener('click', () => {
                showScreen('startScreen');
            });
            
            document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
            document.getElementById('downloadBtn').addEventListener('click', downloadTxt);

            // ==================== 分享成绩卡片功能 ====================
            document.getElementById('shareBtn').addEventListener('click', () => {
                const nickname = gameState.nickname || '匿名';
                const score = gameState.score;
                const level = gameState.currentLevel;
                const config = getLevelConfig(level);
                const timeUsed = config.time - gameState.timeLeft;
                const maxCombo = gameState.maxCombo;

                const cardDataUrl = generateShareCardGame2(nickname, score, level, timeUsed, maxCombo);
                document.getElementById('shareCardImage').src = cardDataUrl;
                document.getElementById('shareModal').classList.add('show');
            });

            document.getElementById('shareCloseBtn').addEventListener('click', () => {
                document.getElementById('shareModal').classList.remove('show');
            });

            document.getElementById('shareModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('shareModal')) {
                    document.getElementById('shareModal').classList.remove('show');
                }
            });

            // 生成消消乐游戏分享卡片
            function generateShareCardGame2(nickname, score, level, timeUsed, maxCombo) {
                const canvas = document.createElement('canvas');
                canvas.width = 750;
                canvas.height = 1334;
                const ctx = canvas.getContext('2d');

                // 绘制深色科技背景
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#0a0e27');
                gradient.addColorStop(0.5, '#0d1b2a');
                gradient.addColorStop(1, '#1a237e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 绘制网格背景
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
                ctx.lineWidth = 1;
                for (let i = 0; i < canvas.width; i += 50) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, canvas.height);
                    ctx.stroke();
                }
                for (let i = 0; i < canvas.height; i += 50) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(canvas.width, i);
                    ctx.stroke();
                }

                // 顶部装饰
                ctx.fillStyle = '#00e5ff';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0, 229, 255, 0.8)';
                ctx.shadowBlur = 15;
                ctx.fillText('◆ ◇ ◇', canvas.width / 2, 100);
                ctx.shadowBlur = 0;

                // 游戏名称
                ctx.fillStyle = '#00e5ff';
                ctx.font = 'bold 48px "Orbitron", Arial';
                ctx.shadowColor = 'rgba(0, 229, 255, 0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('FOOD MATCH', canvas.width / 2, 180);
                ctx.shadowBlur = 0;

                // 副标题
                ctx.font = '28px Arial';
                ctx.fillStyle = 'rgba(179, 229, 252, 0.9)';
                ctx.fillText('科技版 | 自定义词库', canvas.width / 2, 230);

                // 中央卡片背景
                ctx.fillStyle = 'rgba(10, 14, 39, 0.9)';
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(50, 280, 650, 680, 30);
                ctx.fill();
                ctx.stroke();

                // 发光边框效果
                ctx.shadowColor = 'rgba(0, 229, 255, 0.5)';
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 玩家昵称
                ctx.fillStyle = '#7eb8c9';
                ctx.font = '28px Arial';
                ctx.fillText('PLAYER', canvas.width / 2, 360);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 42px Arial';
                ctx.fillText(nickname, canvas.width / 2, 420);

                // 分隔线
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(150, 460);
                ctx.lineTo(600, 460);
                ctx.stroke();

                // 分数
                ctx.fillStyle = '#00e5ff';
                ctx.font = 'bold 64px "Orbitron", Arial';
                ctx.shadowColor = 'rgba(0, 229, 255, 0.8)';
                ctx.shadowBlur = 15;
                ctx.fillText(score + ' SCORE', canvas.width / 2, 560);
                ctx.shadowBlur = 0;

                // 统计数据
                ctx.font = '32px Arial';

                // 用时
                ctx.fillStyle = '#7eb8c9';
                ctx.fillText('TIME', canvas.width / 2 - 120, 660);
                ctx.fillStyle = '#4fc3f7';
                ctx.font = 'bold 40px Arial';
                ctx.fillText(timeUsed + 'S', canvas.width / 2 - 120, 720);

                // 最高连击
                ctx.fillStyle = '#7eb8c9';
                ctx.font = '32px Arial';
                ctx.fillText('MAX COMBO', canvas.width / 2 + 120, 660);
                ctx.fillStyle = '#ffd740';
                ctx.font = 'bold 40px Arial';
                ctx.fillText(maxCombo + 'x', canvas.width / 2 + 120, 720);

                // 关卡
                ctx.font = '28px Arial';
                ctx.fillStyle = '#00e676';
                ctx.fillText('LEVEL ' + level, canvas.width / 2, 820);

                // 装饰
                ctx.fillStyle = '#00e5ff';
                ctx.font = '36px Arial';
                ctx.shadowColor = 'rgba(0, 229, 255, 0.8)';
                ctx.shadowBlur = 15;
                ctx.fillText('✨', canvas.width / 2, 900);
                ctx.shadowBlur = 0;

                // 底部引导
                ctx.fillStyle = 'rgba(10, 14, 39, 0.9)';
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(50, 980, 650, 280, 30);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#00e5ff';
                ctx.font = 'bold 36px "Orbitron", Arial';
                ctx.shadowColor = 'rgba(0, 229, 255, 0.8)';
                ctx.shadowBlur = 15;
                ctx.fillText('JOIN US', canvas.width / 2, 1080);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#7eb8c9';
                ctx.font = '28px Arial';
                ctx.fillText('食物单词消消乐 - 科技版', canvas.width / 2, 1140);

                // 二维码占位区域
                ctx.fillStyle = 'rgba(0, 229, 255, 0.1)';
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(canvas.width / 2 - 70, 1170, 140, 140, 15);
                ctx.fill();
                ctx.stroke();

                // 二维码装饰图案
                ctx.fillStyle = '#00e5ff';
                const qrSize = 30;
                const qrStartX = canvas.width / 2 - 50;
                const qrStartY = 1190;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if ((i + j) % 2 === 0) {
                            ctx.fillRect(qrStartX + i * qrSize, qrStartY + j * qrSize, qrSize - 4, qrSize - 4);
                        }
                    }
                }
                ctx.fillStyle = '#00e676';
                for (let i = 0; i < 2; i++) {
                    for (let j = 0; j < 2; j++) {
                        ctx.fillRect(qrStartX + 100 + i * qrSize, qrStartY + j * qrSize, qrSize - 4, qrSize - 4);
                    }
                }

                return canvas.toDataURL('image/png');
            }
        });

        function updateLevelButtons() {
            document.getElementById('level2Btn').classList.toggle('locked', !gameState.levelUnlocked[2]);
            document.getElementById('level3Btn').classList.toggle('locked', !gameState.levelUnlocked[3]);
        }

        window.addEventListener('load', () => {
            const unlocked = JSON.parse(localStorage.getItem('matchGameUnlocked') || '{"1":true,"2":false,"3":false}');
            gameState.levelUnlocked = unlocked;
            updateLevelButtons();
        });

        function saveUnlockedState() {
            localStorage.setItem('matchGameUnlocked', JSON.stringify(gameState.levelUnlocked));
        }
    </script>
