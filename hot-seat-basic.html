<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hot Seat - 英语滚词游戏</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FF5E5E;
            /* 优化新增：更温暖的红 */
            --secondary: #00d4ff;
            --accent: #9B6DFF;
            /* 优化新增：更鲜艳的紫 */
            --glow: #00d4ff;
            --purple: #9B6DFF;
            /* 优化新增：同步accent */
            --warm-glow: #FFE66D;
            /* 优化新增：暖色高光 */
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            /* 优化新增：统一卡片阴影 */
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Poppins', 'Microsoft YaHei', sans-serif;
            /* 优化新增：背景渐变提亮，更明快 */
            background: linear-gradient(135deg, #1a1035 0%, #302b63 50%, #1e1a3a 100%);
            color: #FFFFFF;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 输入页面 */
        .input-page {
            position: relative;
            z-index: 10;
            min-height: 100%;
            padding: 20px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-page.hidden {
            display: none;
        }

        .title {
            font-family: 'Bangers', cursive;
            font-size: clamp(2.5rem, 10vw, 5rem);
            color: #FFFFFF;
            /* 优化新增：增强发光层次 */
            text-shadow:
                0 0 8px #00d4ff,
                0 0 18px #00d4ff,
                0 0 35px #00d4ff,
                0 0 55px #9B6DFF,
                0 0 80px #9B6DFF,
                5px 5px 0 #FF5E5E;
            margin-top: 10px;
            margin-bottom: 5px;
            letter-spacing: 4px;
            text-align: center;
            /* 优化新增：标题浮动动画 */
            animation: titleFloat 3s ease-in-out infinite;
        }
        /* 优化新增：标题微微浮动 */
        @keyframes titleFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .subtitle {
            background: linear-gradient(90deg, #00d4ff, #9B6DFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            margin-top: 25px;
            width: 100%;
            max-width: 500px;
            /* 优化新增：增强边框发光 */
            border: 2px solid rgba(255, 255, 255, 0.2);
            /* 优化新增：更深的阴影 */
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            /* 优化新增：过渡动画 */
            transition: border-color 0.35s ease, box-shadow 0.35s ease;
        }
        /* 优化新增：输入区域悬停微亮 */
        .input-section:hover {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .input-label {
            color: #FFFFFF;
            font-size: 0.95rem;
            flex: 1;
        }

        .btn-save {
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            padding: 8px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            /* 优化新增：更丰富的光泽渐变 */
            background: linear-gradient(135deg, #00d4ff 0%, #9B6DFF 50%, #FF5E5E 100%);
            background-size: 200% 200%;
            color: #FFFFFF;
            /* 优化新增：增强阴影 */
            box-shadow: 0 4px 18px rgba(0, 212, 255, 0.45), 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            /* 优化新增 */
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            /* 优化新增：背景位移动画 */
            animation: shimmerBg 3s ease-in-out infinite;
        }
        /* 优化新增：光泽流动 */
        @keyframes shimmerBg {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .btn-save:hover {
            transform: translateY(-2px);
            /* 优化新增：悬停增强阴影 */
            box-shadow: 0 6px 24px rgba(0, 212, 255, 0.6), 0 3px 10px rgba(0, 0, 0, 0.25);
        }
        .btn-save:active {
            transform: scale(0.96);
        }
        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .word-input {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            color: #2C3E50;
            resize: vertical;
            font-family: 'Poppins', sans-serif;
            /* 优化新增：过渡动画 */
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }
        .word-input:focus {
            outline: none;
            border-color: #00d4ff;
            /* 优化新增：增强聚焦发光 */
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.6), 0 0 50px rgba(155, 109, 255, 0.3);
            background: #FFFFFF;
        }

        .input-hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .saved-section {
            width: 100%;
            max-width: 500px;
            margin-top: 25px;
        }

        .saved-title {
            color: #FFE66D;
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
            /* 优化新增：标题发光 */
            text-shadow: 0 0 8px rgba(255, 230, 109, 0.5);
        }

        .data-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 25px 0;
        }
        .btn-action {
            font-size: 0.85rem;
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            /* 优化新增：更平滑的过渡 */
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            /* 优化新增：微阴影 */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            /* 优化新增 */
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transform: translateY(-1px);
            /* 优化新增 */
        }
        .btn-action:active {
            transform: scale(0.95);
        }

        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .saved-empty {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        .saved-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            /* 优化新增：更平滑的过渡 */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            /* 优化新增：增强阴影 */
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            /* 优化新增：卡片入场动画 */
            animation: cardSlideIn 0.4s ease-out;
        }
        /* 优化新增：卡片滑入 */
        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .saved-card:hover {
            transform: translateY(-3px);
            /* 优化新增 */
            background: rgba(255, 255, 255, 0.18);
            /* 优化新增 */
            border-color: rgba(0, 212, 255, 0.5);
            /* 优化新增：发光边框 */
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 212, 255, 0.2);
            /* 优化新增 */
        }

        .saved-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            /* 优化新增：更丰富的光泽渐变 */
            background: linear-gradient(135deg, #FF5E5E 0%, #FF8E8E 30%, #00d4ff 70%, #9B6DFF 100%);
            background-size: 200% 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            /* 优化新增：光泽动画 */
            animation: iconShimmer 4s ease-in-out infinite;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            /* 优化新增 */
        }
        /* 优化新增：图标光泽 */
        @keyframes iconShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .saved-info {
            flex: 1;
            min-width: 0;
        }
        .saved-name {
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .saved-count {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        .saved-delete {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 100, 100, 0.2);
            color: #FF6B6B;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 优化新增：更平滑的过渡 */
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }
        .saved-delete:hover {
            background: rgba(255, 100, 100, 0.4);
            transform: scale(1.1);
            /* 优化新增：发光效果 */
            box-shadow: 0 0 14px rgba(255, 100, 100, 0.5);
        }

        .btn-start-page {
            font-family: 'Bangers', cursive;
            font-size: 1.6rem;
            padding: 14px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3px;
            /* 优化新增：更丰富的光泽渐变 */
            background: linear-gradient(135deg, #FF5E5E 0%, #FF8E8E 40%, #FFB3B3 100%);
            background-size: 200% 200%;
            color: #FFFFFF;
            /* 优化新增：增强阴影层次 */
            box-shadow: 0 8px 28px rgba(255, 94, 94, 0.5), 0 3px 10px rgba(0, 0, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* 优化新增 */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 50px;
            margin-top: 15px;
            /* 优化新增：脉冲动画 */
            animation: btnPulse 2.5s ease-in-out infinite;
        }
        /* 优化新增：按钮脉冲 */
        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 8px 28px rgba(255, 94, 94, 0.5), 0 3px 10px rgba(0, 0, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 12px 36px rgba(255, 94, 94, 0.7), 0 5px 16px rgba(0, 0, 0, 0.3), inset 0 2px 0 rgba(255, 255, 255, 0.3);
            }
        }
        .btn-start-page:hover {
            transform: translateY(-3px) scale(1.03);
            /* 优化新增 */
            box-shadow: 0 14px 35px rgba(255, 94, 94, 0.65), 0 6px 16px rgba(0, 0, 0, 0.3), inset 0 2px 0 rgba(255, 255, 255, 0.25);
            /* 优化新增 */
            background-position: 100% 50%;
            /* 优化新增 */
        }
        .btn-start-page:active {
            transform: scale(0.96);
        }

        /* 游戏页面 */
        .game-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
            flex-direction: column;
            /* 优化新增：进入动画预备 */
        }
        .game-page.active {
            display: flex;
            /* 优化新增：页面进入动画 */
            animation: pageFadeIn 0.4s ease-out;
        }
        /* 优化新增：游戏页面淡入 */
        @keyframes pageFadeIn {
            from {
                opacity: 0;
                filter: blur(8px);
            }
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        /* 游戏头部 - 左中右三栏布局 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 18px 15px 12px;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
        }

        .header-left {
            flex-shrink: 0;
        }

        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            margin-top: 50px;
        }

        .game-title {
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            color: #FFFFFF;
            /* 优化新增：增强发光 */
            text-shadow:
                0 0 8px #00d4ff,
                0 0 18px #00d4ff,
                0 0 30px #00d4ff,
                0 0 50px #9B6DFF,
                3px 3px 0 #FF5E5E;
            letter-spacing: 3px;
        }

        .brand-name {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.32);
            letter-spacing: 1px;
            margin-left: 8px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        /* 全屏按钮 */
        .btn-fullscreen {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 优化新增：更平滑的过渡 */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-fullscreen:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.08);
            /* 优化新增 */
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
            /* 优化新增 */
        }
        .btn-fullscreen:active {
            transform: scale(0.95);
        }

        .fullscreen-icon {
            width: 18px;
            height: 18px;
            position: relative;
        }
        .fullscreen-icon::before,
        .fullscreen-icon::after {
            content: '';
            position: absolute;
            border: 1.5px solid currentColor;
        }
        .fullscreen-icon::before {
            width: 9px;
            height: 9px;
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }
        .fullscreen-icon::after {
            width: 9px;
            height: 9px;
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }
        .btn-fullscreen.active .fullscreen-icon::before {
            border: none;
            border-left: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
        }
        .btn-fullscreen.active .fullscreen-icon::after {
            border: none;
            border-right: 2px solid currentColor;
            border-top: 2px solid currentColor;
        }

        /* 游戏主体 */
        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            min-height: 0;
        }

        .word-display {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            min-height: 0;
            /* 优化新增：过渡 */
            transition: transform 0.3s ease;
        }

        .current-word {
            font-family: 'Bangers', cursive;
            font-size: clamp(3.5rem, 20vw, 12rem);
            color: #FFFFFF;
            /* 优化新增：极强发光焦点引导 */
            text-shadow:
                0 0 12px #00d4ff,
                0 0 24px #00d4ff,
                0 0 48px #00d4ff,
                0 0 72px #9B6DFF,
                0 0 110px #9B6DFF,
                0 0 160px #FF5E5E;
            position: relative;
            letter-spacing: 4px;
            will-change: transform, opacity;
            text-align: center;
            word-break: break-word;
            max-width: 95%;
            transition: text-shadow 0.35s ease, transform 0.2s ease;
            /* 优化新增 */
        }

        .current-word.rolling {
            animation: rollBounce 0.1s ease-out;
            /* 优化新增：微调动画时长 */;
        }
        @keyframes rollBounce {
            0% {
                transform: scale(1.06) rotate(-1.5deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .current-word.stopping {
            /* 优化新增：增强停止时的发光和动画 */
            text-shadow:
                0 0 18px #00d4ff,
                0 0 36px #00d4ff,
                0 0 65px #00d4ff,
                0 0 100px #9B6DFF,
                0 0 150px #9B6DFF,
                0 0 200px #FFE66D;
            animation: stopCelebrate 0.55s ease-out forwards, wordGlow 1.5s ease-in-out infinite;
        }
        @keyframes wordGlow {
            0%,
            100% {
                text-shadow:
                    0 0 18px #00d4ff,
                    0 0 36px #00d4ff,
                    0 0 65px #00d4ff,
                    0 0 100px #9B6DFF,
                    0 0 150px #9B6DFF,
                    0 0 200px #FFE66D;
            }
            50% {
                text-shadow:
                    0 0 28px #00d4ff,
                    0 0 55px #00d4ff,
                    0 0 85px #00d4ff,
                    0 0 130px #9B6DFF,
                    0 0 180px #9B6DFF,
                    0 0 240px #FFE66D;
            }
        }

        .word-display.celebrating::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 350px;
            height: 350px;
            transform: translate(-50%, -50%);
            /* 优化新增：更温暖的庆祝光晕 */
            background: radial-gradient(circle, #FFE66D 0%, #FFB3B3 30%, #00d4ff 50%, transparent 65%);
            opacity: 0;
            animation: pulseGlow 0.7s ease-out forwards;
            /* 优化新增 */
            pointer-events: none;
        }
        @keyframes pulseGlow {
            0% {
                transform: translate(-50%, -50%) scale(0.25);
                opacity: 0.9;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.6);
                opacity: 0;
            }
        }

        .burst-particle {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            will-change: transform, opacity;
        }
        @keyframes burst {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0);
                opacity: 0;
            }
        }

        .counter {
            /* 优化新增：更丰富的光泽渐变 */
            background: linear-gradient(135deg, #FF5E5E 0%, #FF8E8E 40%, #00d4ff 100%);
            background-size: 200% 200%;
            padding: 12px 30px;
            border-radius: 50px;
            margin: 12px 0 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            /* 优化新增：增强阴影和发光 */
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 212, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            /* 优化新增：光泽动画 */
            animation: counterShimmer 3.5s ease-in-out infinite;
            /* 优化新增：过渡 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        /* 优化新增：计数器光泽 */
        @keyframes counterShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .counter-label {
            color: #FFFFFF;

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';
            const $ = id => document.getElementById(id);

            // 本地存储
            class Storage {
                constructor() {
                    this.key = 'hotseat_lists';
                    this.init();
                }
                init() {
                    if (this.getAll().length === 0) {
                        this.save('🌟 Unit 3 词汇', ['apple', 'banana', 'cat', 'dog', 'elephant', 'fish', 'green',
                            'happy', 'ice cream', 'jump'
                        ]);
                        this.save('👥 三年级2班', ['张小明', '李小红', '王大力', '刘美美', '陈小明', '杨丽丽', '赵小宇', '周小芳']);
                    }
                }
                getAll() { try { return JSON.parse(localStorage.getItem(this.key)) || []; } catch { return []; } }
                save(name, items) {
                    const lists = this.getAll();
                    const idx = lists.findIndex(x => x.name === name);
                    const item = { name, items, time: idx >= 0 ? lists[idx].time : Date.now() };
                    if (idx >= 0) lists[idx] = item;
                    else lists.unshift(item);
                    localStorage.setItem(this.key, JSON.stringify(lists));
                }
                delete(name) { localStorage.setItem(this.key, JSON.stringify(this.getAll().filter(x => x.name !==
                        name))); }
                get(name) { return this.getAll().find(x => x.name === name); }
                export() {
                    const data = this.getAll();
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'hot-seat-data.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
                import(jsonStr) {
                    try {
                        const data = JSON.parse(jsonStr);
                        if (!Array.isArray(data)) throw new Error('格式错误');
                        data.forEach(item => {
                            if (item.name && Array.isArray(item.items)) {
                                this.save(item.name, item.items);
                            }
                        });
                        return { success: true, count: data.length };
                    } catch (e) {
                        return { success: false, error: e.message };
                    }
                }
            }

            // 全屏
            class Fullscreen {
                constructor() {
                    this.btn = $('btnFullscreen');
                    this.on = !!document.fullscreenElement;
                    this.btn.addEventListener('click', this.toggle.bind(this), false);
                    document.addEventListener('fullscreenchange', this.onChange.bind(this));
                    this.updateBtn();
                }
                toggle() {
                    if (this.on) {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    } else {
                        var elem = document.documentElement;
                        if (elem.requestFullscreen) elem.requestFullscreen();
                        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                        else if (elem.webkitEnterFullscreen) elem.webkitEnterFullscreen(); // iOS Safari
                    }
                }
                onChange() {
                    this.on = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    this.updateBtn();
                }
                updateBtn() {
                    this.btn.classList.toggle('active', this.on);
                    this.btn.title = this.on ? '退出全屏' : '全屏';
                }
            }

            // 音效
            class Sound {
                constructor() { this.ctx = null; }
                init() { if (!this.ctx) try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch {} }
                roll() {
                    if (!this.ctx) return;
                    const o = this.ctx.createOscillator(),
                        g = this.ctx.createGain();
                    o.connect(g);
                    g.connect(this.ctx.destination);
                    o.frequency.value = [600, 700, 800, 900, 1000][Math.floor(Math.random() * 5)];
                    o.type = 'square';
                    const t = this.ctx.currentTime;
                    g.gain.setValueAtTime(0.05, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                    o.start(t);
                    o.stop(t + 0.04);
                }
                stop() {
                    if (!this.ctx) return;
                    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                        const o = this.ctx.createOscillator(),
                            g = this.ctx.createGain();
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        o.frequency.value = f;
                        o.type = 'sine';
                        const t = this.ctx.currentTime + i * 0.06;
                        g.gain.setValueAtTime(0, t);
                        g.gain.linearRampToValueAtTime(0.18, t + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                        o.start(t);
                        o.stop(t + 0.3);
                    });
                }
                complete() {
                    if (!this.ctx) return;
                    [523.25, 587.33, 659.25, 783.99, 880, 1046.50, 1174.66, 1318.51].forEach((f, i) => {
                        const o = this.ctx.createOscillator(),
                            g = this.ctx.createGain();
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        o.frequency.value = f;
                        o.type = 'sine';
                        const t = this.ctx.currentTime + i * 0.1;
                        g.gain.setValueAtTime(0.12, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                        o.start(t);
                        o.stop(t + 0.25);
                    });
                }
            }

            // 粒子（撒花效果）- v3-13：粒子数20→30，飞散距离80~180→150~300
            class Burst {
                constructor(c) { this.c = c;
                    this.pool = []; }
                fire(x, y) {
                    const colors = ['#FF6B6B', '#00d4ff', '#8b5cf6', '#00d4ff', '#FF6B6B'];
                    // v3-13：粒子数从20改为30
                    for (let i = 0; i < 30; i++) {
                        let p = this.pool.pop() || document.createElement('div');
                        p.className = 'burst-particle';
                        p.style.left = x + 'px';
                        p.style.top = y + 'px';
                        p.style.background = colors[i % colors.length];
                        const a = Math.PI * 2 * i / 30;
                        // v3-13：飞散距离从 80 + Math.random() * 100 改为 150 + Math.random() * 150 (150~300px)
                        const d = 150 + Math.random() * 150;
                        p.style.setProperty('--tx', Math.cos(a) * d + 'px');
                        p.style.setProperty('--ty', Math.sin(a) * d + 'px');
                        p.style.animation = 'none';
                        p.style.opacity = '1';
                        p.offsetHeight;
                        p.style.animation = 'burst 0.8s ease-out forwards';
                        this.c.appendChild(p);
                    }
                    setTimeout(() => {
                        [...this.c.children].forEach(p => {
                            if (p.classList.contains('burst-particle') && p.style.opacity === '0')
                                this.pool.push(p);
                        });
                    }, 1000);
                }
            }

            // 背景 - v3-15：霓虹灯光点数量翻倍（/80 → /40）
            class Background {
                constructor(canvas) {
                    this.c = canvas;
                    this.ctx = canvas.getContext('2d');
                    this.ps = []; // 原有小光点
                    this.neonPs = []; // v3-13新增：霓虹灯光点
                    this.fc = 0;
                    this.resize();
                    window.addEventListener('resize', () => this.resize());
                    this.init();
                    this.animate();
                }
                resize() { this.c.width = window.innerWidth;
                    this.c.height = window.innerHeight; }
                init() {
                    // 原有小光点
                    const n = Math.min(40, Math.floor((this.c.width * this.c.height) / 30000));
                    this.ps = [];
                    for (let i = 0; i < n; i++) {
                        this.ps.push({
                            x: Math.random() * this.c.width,
                            y: Math.random() * this.c.height,
                            r: Math.random() * 2 + 0.5,
                            sx: (Math.random() - 0.5) * 0.3,
                            sy: (Math.random() - 0.5) * 0.3,
                            o: Math.random() * 0.5 + 0.2,
                            h: Math.random() * 80 + 200
                        });
                    }

                    // v3-16：霓虹灯光点数量增加（/40 → /25，约50-80个）
                    const neonCount = Math.floor(this.c.width / 25);
                    this.neonPs = [];
                    const neonColors = ['#ff0040', '#ff3366', '#ff6688', '#00aaff', '#0088ff', '#0066ff']; // 红蓝色系

                    for (let i = 0; i < neonCount; i++) {
                        const isRed = Math.random() > 0.5;
                        const baseColor = isRed ?
                            ['#FF9E9E', '#FFB3B3', '#FFC8C8', '#FF8A8A'][Math.floor(Math.random() * 4)] :
                            ['#66E5FF', '#99EEFF', '#B3F3FF', '#4DD9FF'][Math.floor(Math.random() * 4)];

                        // 大小有大有小，大的是小的3-4倍
                        const sizeType = Math.random();
                        let r;
                        if (sizeType < 0.3) {
                            r = Math.random() * 1.5 + 1; // 小: 1~2.5
                        } else if (sizeType < 0.7) {
                            r = Math.random() * 2 + 2.5; // 中: 2.5~4.5
                        } else {
                            r = Math.random() * 3 + 4.5; // 大: 4.5~7.5
                        }

                        // v3-16：改为原地晃动效果，删除 sx/sy 直线移动，添加晃动参数
                        this.neonPs.push({
                            x: Math.random() * this.c.width,
                            y: Math.random() * this.c.height,
                            ox: 0, // v3-16：初始位置X（originX）
                            oy: 0, // v3-16：初始位置Y（originY）
                            r: r,
                            baseR: r,
                            // v3-16：晃动参数替代原来的直线移动
                            // v3-17：晃动幅度5-15px，像星光微微摇曳
                            wobbleRange: Math.random() * 10 + 5,
                            wobbleSpeed: Math.random() * 0.015 + 0.005, // 晃动速度0.005-0.02
                            wobblePhase: Math.random() * Math.PI * 2, // 随机初始相位
                            color: baseColor,
                            // 闪烁参数
                            flickerSpeed: Math.random() * 0.03 + 0.01,
                            flickerPhase: Math.random() * Math.PI * 2,
                            flickerAmp: Math.random() * 0.4 + 0.3
                        });
                    }

                    // v3-16：设置所有霓虹点的初始位置
                    this.neonPs.forEach(p => {
                        p.ox = p.x;
                        p.oy = p.y;
                    });
                }
                animate() {
                    this.fc++;
                    if (this.fc >= 3) {
                        this.fc = 0;
                        // v3-17：改为clearRect + 填充背景，避免幽灵长尾
                        this.ctx.clearRect(0, 0, this.c.width, this.c.height);
                        // 填充背景渐变（与body背景一致）
                        const bgGrad = this.ctx.createLinearGradient(0, 0, this.c.width, this.c.height);
                        bgGrad.addColorStop(0, '#0f0c29');
                        bgGrad.addColorStop(0.5, '#302b63');
                        bgGrad.addColorStop(1, '#24243e');
                        this.ctx.fillStyle = bgGrad;
                        this.ctx.fillRect(0, 0, this.c.width, this.c.height);

                        // 绘制原有小光点
                        this.ps.forEach(p => {
                            p.x += p.sx;
                            p.y += p.sy;
                            if (p.x < 0) p.x = this.c.width;
                            if (p.x > this.c.width) p.x = 0;
                            if (p.y < 0) p.y = this.c.height;
                            if (p.y > this.c.height) p.y = 0;
                            this.ctx.beginPath();
                            this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                            this.ctx.fillStyle = `hsla(${p.h},70%,60%,${p.o})`;
                            this.ctx.fill();
                        });

                        // v3-17：绘制星光闪烁效果（替代霓虹灯大光晕效果）
                        const time = Date.now() * 0.001;
                        this.neonPs.forEach(p => {
                            // v3-17：原地晃动效果（正弦波）
                            p.x = p.ox + Math.sin(time * p.wobbleSpeed * 60 + p.wobblePhase) * p.wobbleRange;
                            p.y = p.oy + Math.cos(time * p.wobbleSpeed * 60 + p.wobblePhase) * p.wobbleRange;

                            // 计算闪烁亮度 - 更自然的星星闪烁
                            const flicker = Math.sin(time * p.flickerSpeed * 60 + p.flickerPhase);
                            const coreBrightness = 0.4 + flicker * 0.35; // 核心亮度0.05~0.75

                            // v3-17：改为星光效果，glow缩小到r*1.5，亮度降低
                            const glowSize = p.r * 1.5;
                            // 微弱的短距离glow
                            const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize);
                            gradient.addColorStop(0, p.color + Math.floor(coreBrightness * 40).toString(16).padStart(
                                2, '0'));
                            gradient.addColorStop(0.5, p.color + Math.floor(coreBrightness * 15).toString(16).padStart(
                                2, '0'));
                            gradient.addColorStop(1, p.color + '00');
                            this.ctx.beginPath();
                            this.ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
                            this.ctx.fillStyle = gradient;
                            this.ctx.fill();

                            // v3-17：星光核心光点，适当降低整体亮度
                            this.ctx.beginPath();
                            this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                            this.ctx.fillStyle = p.color;
                            this.ctx.globalAlpha = Math.min(coreBrightness, 0.7); // 最高不超过0.7
                            this.ctx.fill();
                            this.ctx.globalAlpha = 1;
                        });
                    }
                    requestAnimationFrame(() => this.animate());
                }
            }

            function toast(msg) {
                const t = $('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            }

            // 游戏主类
            class Game {
                constructor() {
                    this.words = [];
                    this.used = [];
                    this.current = null;
                    this.rolling = false;
                    this.timer = null;
                    this.started = false;
                    this.storage = new Storage();
                    this.sound = new Sound();
                    this.fs = new Fullscreen();
                    this.bg = new Background($('bgCanvas'));
                    this.burst = new Burst($('wordDisplay'));
                    this.init();
                }

                init() {
                    $('btnStartPage').onclick = () => this.start();
                    $('btnMain').onclick = () => this.toggle();
                    $('btnEnd').onclick = () => this.end();
                    $('btnSave').onclick = () => this.showSave();
                    $('btnCancelSave').onclick = () => $('saveModal').classList.remove('active');
                    $('btnConfirmSave').onclick = () => this.confirmSave();
                    $('saveNameInput').onkeyup = e => { if (e.key === 'Enter') this.confirmSave(); };
                    $('saveModal').onclick = e => { if (e.target === $('saveModal')) $('saveModal').classList.remove(
                            'active'); };
                    $('btnCloseTips').onclick = () => $('tipsModal').classList.remove('active');
                    $('tipsModal').onclick = e => { if (e.target === $('tipsModal')) $('tipsModal').classList.remove(
                            'active'); };

                    // 导出功能
                    $('btnExport').onclick = () => {
                        this.storage.export();
                        toast('导出成功！');
                    };

                    // 导入功能
                    $('btnImport').onclick = () => $('importFileInput').click();
                    $('importFileInput').onchange = e => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = ev => {
                            const result = this.storage.import(ev.target.result);
                            if (result.success) {
                                this.renderList();
                                toast(`导入成功！共 ${result.count} 个列表`);
                            } else {
                                toast('导入失败：文件格式无效');
                            }
                        };
                        reader.readAsText(file);
                        e.target.value = ''; // 重置以便下次选择同一文件
                    };

                    // 下载网页功能
                    function downloadGame() {
                        const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                        const blob = new Blob([html], { type: 'text/html' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'hot-seat-free.html';
                        a.click();
                        URL.revokeObjectURL(a.href);
                    }
                    $('btnDownload').onclick = downloadGame;

                    $('wordInput').oninput = () => { $('btnSave').disabled = !$('wordInput').value.trim(); };
                    $('btnSave').disabled = false;
                    this.renderList();
                }

                fmt(w) {
                    return w;
                }

                parse() { return ($('wordInput').value || '').split(/[,\n]/).map(x => x.trim()).filter(x => x); }

                start() {
                    this.sound.init();
                    this.words = this.parse();
                    if (!this.words.length) { $('statusMessage').textContent = '请输入至少一个词汇！'; return; }
                    this.used = [];
                    this.started = true;
                    $('inputPage').classList.add('hidden');
                    $('gamePage').classList.add('active');
                    $('usedWordsSection').style.display = 'block';
                    $('btnEnd').style.display = 'block';
                    this.update();
                }

                toggle() {
                    this.sound.init();
                    if (!this.started) { this.start(); return; }
                    if (this.rolling) this.stop();
                    else this.roll();
                }

                roll() {
                    this.rolling = true;
                    this.updateBtn();
                    $('statusMessage').textContent = '点击"停！"停止';
                    this.timer = setInterval(() => {
                        const rem = this.getRem();
                        if (!rem.length) { this.stop(); return; }
                        this.current = rem[Math.floor(Math.random() * rem.length)];
                        $('currentWord').textContent = this.fmt(this.current);
                        $('currentWord').classList.remove('stopping');
                        $('currentWord').offsetHeight;
                        $('currentWord').classList.add('rolling');
                        this.sound.roll();
                        setTimeout(() => $('currentWord').classList.remove('rolling'), 60);
                    }, 100);
                }

                stop() {
                    if (!this.rolling) return;
                    clearInterval(this.timer);
                    this.rolling = false;
                    this.used.push(this.current);
                    $('currentWord').classList.remove('rolling');
                    $('currentWord').classList.add('stopping');
                    $('wordDisplay').classList.add('celebrating');
                    const r = $('currentWord').getBoundingClientRect();
                    const d = $('wordDisplay').getBoundingClientRect();
                    this.burst.fire(r.left + r.width / 2 - d.left, r.top + r.height / 2 - d.top);
                    this.sound.stop();
                    setTimeout(() => $('wordDisplay').classList.remove('celebrating'), 600);
                    this.updateList();
                    this.update();
                    const n = this.getRem().length;
                    if (!n) this.done();
                    else $('statusMessage').textContent = `"${this.fmt(this.current)}" ✓ 还剩 ${n} 个`;
                }

                getRem() { return this.words.filter(w => !this.used.includes(w)); }
                update() { $('counterNumber').textContent = this.getRem().length;
                    this.updateBtn(); }

                updateBtn() {
                    if (this.rolling) { $('btnMain').textContent = '停！';
                        $('btnMain').classList.add('rolling'); } else { $('btnMain').textContent = this.started ? '继续' :
                            '开 始';
                        $('btnMain').classList.remove('rolling'); }
                }

                updateList() {
                    $('usedWordsList').innerHTML = this.used.map(w =>
                        `<span class="used-word">${this.fmt(w)}</span>`).join('');
                }

                done() {
                    $('completeMessage').style.display = 'block';
                    $('statusMessage').textContent = '🎉 全部完成！';
                    this.sound.complete();
                    $('btnMain').style.display = 'none';
                    setTimeout(() => {
                        $('completeMessage').style.display = 'none';
                        $('btnMain').style.display = 'block';
                        $('btnMain').textContent = '再来一轮';
                        $('btnMain').classList.remove('rolling');
                    }, 3000);
                }

                end() {
                    clearInterval(this.timer);
                    this.rolling = false;
                    this.started = false;
                    this.words = [];
                    this.used = [];
                    this.current = null;
                    $('inputPage').classList.remove('hidden');
                    $('gamePage').classList.remove('active');
                    $('btnMain').textContent = '开 始';
                    $('btnMain').classList.remove('rolling');
                    $('btnMain').style.display = 'block';
                    $('btnEnd').style.display = 'none';
                    $('usedWordsSection').style.display = 'none';
                    $('wordDisplay').classList.remove('celebrating');
                    $('completeMessage').style.display = 'none';
                    $('currentWord').textContent = '?';
                    $('currentWord').className = 'current-word';
                    $('counterNumber').textContent = '15';
                    $('statusMessage').textContent = '点击"开始"开始滚词';
                    $('usedWordsList').innerHTML = '';
                }

                showSave() {
                    if (!$('wordInput').value.trim()) { toast('请先输入内容'); return; }
                    $('saveModal').classList.add('active');
                    $('saveNameInput').value = '';
                    $('saveNameInput').focus();
                }

                confirmSave() {
                    const name = $('saveNameInput').value.trim();
                    if (!name) { toast('请输入名称'); return; }
                    const items = this.parse();
                    if (!items.length) { toast('内容不能为空'); return; }
                    this.storage.save(name, items);
                    $('saveModal').classList.remove('active');
                    this.renderList();
                    toast(`已保存"${name}" (${items.length}个)`);
                    // 第一次保存后弹出数据保存提示
                    if (!localStorage.getItem('hotseat_firstSaveShown')) {
                        localStorage.setItem('hotseat_firstSaveShown', 'true');
                        setTimeout(() => $('tipsModal').classList.add('active'), 300);
                    }
                }

                renderList() {
                    const lists = this.storage.getAll();
                    if (!lists.length) { $('savedList').innerHTML =
                            '<div class="saved-empty">还没有保存的列表<br>输入内容后点击保存</div>'; return; }
                    $('savedList').innerHTML = lists.map(item => `
                        <div class="saved-card" data-name="${item.name.replace(/"/g, '&quot;')}">
                            <div class="saved-icon">📋</div>
                            <div class="saved-info">
                                <div class="saved-name">${item.name}</div>
                                <div class="saved-count">${item.items.length} 个</div>
                            </div>
                            <button class="saved-delete" data-name="${item.name.replace(/"/g, '&quot;')}" title="删除">✕</button>
                        </div>
                    `).join('');

                    $('savedList').querySelectorAll('.saved-card').forEach(card => {
                        card.onclick = e => {
                            if (!e.target.classList.contains('saved-delete')) {
                                const item = this.storage.get(card.dataset.name);
                                if (item) { $('wordInput').value = item.items.join('\n');
                                    $('btnSave').disabled = false;
                                    toast(`已加载"${item.name}"`); }
                            }
                        };
                    });

                    $('savedList').querySelectorAll('.saved-delete').forEach(btn => {
                        btn.onclick = e => { e.stopPropagation();
                            this.storage.delete(btn.dataset.name);
                            this.renderList();
                            toast(`已删除"${btn.dataset.name}"`); };
                    });
                }
            }

            document.addEventListener('DOMContentLoaded', () => new Game());
        })();
    </script>
